<script>
let clienteLogado = JSON.parse(localStorage.getItem('cliente_b2b') || 'null');
let listaOfertas = [];
let carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');

// Função auxiliar para evitar XSS e erros de variáveis não definidas
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtMoeda = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function init() {
  if (!clienteLogado) {
    document.getElementById('modalLogin').style.display = 'flex';
  } else {
    document.getElementById('cliInfo').textContent = `🏢 ${clienteLogado.nome} (${clienteLogado.uf})`;
    await carregarOfertas();
  }
  atualizarCarrinho();
}

async function fazerLogin() {
  const cnpj = document.getElementById('cnpjInput').value.replace(/\D/g, '');
  if (!cnpj) return alert('Digite o CNPJ');

  try {
    const r = await fetch('/api/login/' + cnpj);
    const j = await r.json();
    if (j.ok) {
      clienteLogado = { ...j.cliente, acrescimo: j.regra_acrescimo.porcentagem };
      localStorage.setItem('cliente_b2b', JSON.stringify(clienteLogado));
      document.getElementById('modalLogin').style.display = 'none';
      document.getElementById('cliInfo').textContent = `🏢 ${clienteLogado.nome} (${clienteLogado.uf})`;
      carregarOfertas();
    } else { alert(j.erro || 'CNPJ inválido'); }
  } catch (e) { alert('Erro na conexão'); }
}

async function carregarOfertas() {
  try {
    const r = await fetch('/api/ofertas');
    const j = await r.json();

    if (!j.ok || !j.ofertas || j.ofertas.length === 0) {
      document.getElementById('gridOfertas').innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:#94a3b8;">Nenhuma oferta ativa no momento.</div>`;
      return;
    }

    // Procura detalhes adicionais no catálogo para garantir que nenhum dado falhe
    const resCat = await fetch('/api/catalogo');
    const dataCat = await resCat.json();
    const mapaCatalogo = new Map();
    
    if (dataCat.ok && dataCat.itens) {
      dataCat.itens.forEach(it => mapaCatalogo.set(String(it.codigo), it));
    }

    listaOfertas = j.ofertas.map(of => {
      const cat = mapaCatalogo.get(String(of.codigo)) || {};
      
      const subgrupo = of.subgrupo || cat.subgrupo_scraping || cat.descricao_sistema || `Produto ${of.codigo}`;
      const precoBase = Number(of.preco_base || cat.preco_venda || 0);
      const imagem = of.imagem_oferta || cat.imagem_url || '';
      const marca = of.marca || cat.marca || '';

      return {
        ...of,
        subgrupo,
        preco_base: precoBase,
        imagem_oferta: imagem,
        marca
      };
    });

    renderizarEncate();
  } catch (e) {
    console.error("Erro ao carregar ofertas:", e);
    document.getElementById('gridOfertas').innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:#ef4444;">Erro ao carregar ofertas.</div>`;
  }
}

function renderizarEncate() {
  const acrescimo = clienteLogado?.acrescimo || 0;

  const html = listaOfertas.map(item => {
    const precoComAcrescimo = item.preco_base + (item.preco_base * acrescimo / 100);
    const pctDesconto = Number(item.desconto_porcentagem || 0);
    const precoPromocional = precoComAcrescimo - (precoComAcrescimo * pctDesconto / 100);
    const q = carrinho[item.codigo] ? carrinho[item.codigo].qtd : 0;

    const imgHtml = item.imagem_oferta && item.imagem_oferta.trim() !== '' 
      ? `<img src="${item.imagem_oferta}" alt="${escapeHtml(item.subgrupo)}" onerror="this.onerror=null; this.parentElement.innerHTML='🖼️';">`
      : '🖼️';

    return `
      <div class="card-oferta">
        <div class="selo-desconto">-${pctDesconto}% OFF</div>
        <div class="img-box">
          ${imgHtml}
        </div>
        <div class="corpo-oferta">
          ${item.marca ? `<span class="marca-tag">${escapeHtml(item.marca)}</span>` : ''}
          <div class="titulo-prod">${escapeHtml(item.subgrupo)}</div>

          <div class="bloco-preco-balcao">
            <span class="txt-de">De: R$ ${fmtMoeda(precoComAcrescimo)}</span>
            <span class="txt-por">Por: R$ ${fmtMoeda(precoPromocional)}</span>
          </div>

          <button class="btn-add-oferta" onclick="adicionarOferta('${item.codigo}', '${escapeHtml(item.subgrupo).replace(/'/g, "\\'")}', ${item.preco_base}, '${item.imagem_oferta}')">
            🛒 ${q > 0 ? `No Pedido (${q})` : 'Adicionar ao Pedido'}
          </button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('gridOfertas').innerHTML = html;
}

function adicionarOferta(cod, desc, precoBase, img) {
  const atual = carrinho[cod] ? carrinho[cod].qtd : 0;
  carrinho[cod] = { qtd: atual + 1, precoBase, desc, img };
  localStorage.setItem('carrinho_b2b', JSON.stringify(carrinho));
  renderizarEncate();
  atualizarCarrinho();
}

function atualizarCarrinho() {
  const qtdTotal = Object.values(carrinho).reduce((acc, i) => acc + i.qtd, 0);
  const btn = document.getElementById('btnCarrinho');
  if (qtdTotal > 0) {
    btn.style.display = 'flex';
    document.getElementById('qtdCarrinho').textContent = qtdTotal;
  } else {
    btn.style.display = 'none';
  }
}

document.getElementById('cnpjInput')?.addEventListener('input', function(e) {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length > 14) v = v.slice(0, 14);
  v = v.replace(/^(\d{2})(\d)/, '$1.$2');
  v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
  v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
  v = v.replace(/(\d{4})(\d)/, '$1-$2');
  e.target.value = v;
});

init();
</script>
