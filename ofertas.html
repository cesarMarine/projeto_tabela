<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Ofertas Imbatíveis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --vermelho-900:#7f1d1d; --vermelho-600:#dc2626;
    --amarelo-400:#facc15; --azul-800:#003366;
    --cinza-100:#f1f5f9; --verde:#10b981; --verde-hover:#059669;
  }
  body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6f9; color:#1e293b; min-height:100vh; padding: 12px; }
  button { font-family:inherit; cursor:pointer; }

  /* BANNER HERO DE OFERTAS COMPACTO */
  .hero-ofertas {
    background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
    color: white; padding: 20px; text-align: center; position: relative;
    box-shadow: 0 4px 15px rgba(185, 28, 28, 0.2); border-bottom: 4px solid var(--amarelo-400);
    border-radius: 12px; margin-bottom: 20px;
  }
  .hero-ofertas h1 { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 4px; }
  .hero-ofertas p { font-size: 0.85rem; opacity: 0.9; font-weight: 600; }

  /* GRADE DE ENCARTE */
  .encarte-container { max-width: 1400px; margin: 0 auto; }
  .grade-ofertas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

  /* CARD BALCÃO DE PROMOÇÃO */
  .card-oferta {
    background: white; border-radius: 14px; border: 1px solid #fca5a5;
    overflow: hidden; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.06);
    display: flex; flex-direction: column; position: relative; transition: transform 0.2s;
  }
  .card-oferta:hover { transform: translateY(-3px); }

  .selo-desconto {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: linear-gradient(135deg, var(--vermelho-600), var(--vermelho-900));
    color: white; font-weight: 900; font-size: 0.85rem; padding: 4px 10px; border-radius: 6px;
    box-shadow: 0 3px 8px rgba(220, 38, 38, 0.3); border: 1px solid white;
  }

  .img-box {
    width: 100%; aspect-ratio: 1; background: #fff; padding: 12px;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .corpo-oferta { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: #fafafa; border-top: 1px solid var(--cinza-100); }
  .marca-tag { font-size: 0.6rem; font-weight: 800; color: var(--azul-800); text-transform: uppercase; background: var(--cinza-100); padding: 2px 6px; border-radius: 4px; align-self: flex-start; margin-bottom: 4px; }
  .titulo-prod { font-size: 0.85rem; font-weight: 800; color: #0f172a; line-height: 1.2; margin-bottom: 8px; }

  .bloco-preco-balcao {
    background: #fef2f2; border: 1px dashed #fca5a5; padding: 8px;
    border-radius: 8px; text-align: center; margin-bottom: 8px;
  }
  .txt-de { font-size: 0.75rem; color: #94a3b8; text-decoration: line-through; font-weight: 700; display: block; }
  .txt-por { font-size: 1.2rem; color: var(--vermelho-600); font-weight: 900; display: block; line-height: 1.1; }

  .btn-add-oferta {
    width: 100%; background: var(--verde); color: white; border: none;
    padding: 10px; border-radius: 8px; font-weight: 900; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
  }
  .btn-add-oferta:hover { background: var(--verde-hover); }
</style>
</head>
<body>

<header class="hero-ofertas">
  <h1>🔥 ENCARTE DE OFERTAS</h1>
  <p>Preços e condições especiais válidas enquanto durarem os estoques!</p>
</header>

<main class="encarte-container">
  <div class="grade-ofertas" id="gridOfertas">
    <div style="grid-column:1/-1; text-align:center; padding:60px; color:#94a3b8; font-weight:700;">Carregando encarte promocional...</div>
  </div>
</main>

<script>
let clienteLogado = JSON.parse(localStorage.getItem('cliente_b2b') || 'null');
let listaOfertas = [];
let carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtMoeda = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function init() {
  await carregarOfertas();
}

async function carregarOfertas() {
  try {
    const r = await fetch('/api/ofertas');
    const j = await r.json();

    if (!j.ok || !j.ofertas || j.ofertas.length === 0) {
      document.getElementById('gridOfertas').innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:#94a3b8;">Nenhuma oferta ativa no momento.</div>`;
      return;
    }

    const resCat = await fetch('/api/catalogo');
    const dataCat = await resCat.json();
    const mapaCatalogo = new Map();
    
    if (dataCat.ok && dataCat.itens) {
      dataCat.itens.forEach(it => mapaCatalogo.set(String(it.codigo), it));
    }

    listaOfertas = j.ofertas.map(of => {
      const cat = mapaCatalogo.get(String(of.codigo)) || {};
      const subgrupo = of.subgrupo || cat.subgrupo_scraping || cat.descricao_sistema || `Produto ${of.codigo}`;
      const precoBase = Number(of.preco_base || cat.preco_venda || 0);
      const imagem = of.imagem_oferta || cat.imagem_url || '';
      const marca = of.marca || cat.marca || '';

      return {
        ...of,
        subgrupo,
        preco_base: precoBase,
        imagem_oferta: imagem,
        marca
      };
    });

    renderizarEncate();
  } catch (e) {
    document.getElementById('gridOfertas').innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:#ef4444;">Erro ao carregar ofertas.</div>`;
  }
}

function renderizarEncate() {
  const acrescimo = clienteLogado?.acrescimo || 0;
  carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');

  const html = listaOfertas.map(item => {
    const precoComAcrescimo = item.preco_base + (item.preco_base * acrescimo / 100);
    const pctDesconto = Number(item.desconto_porcentagem || 0);
    const precoPromocional = precoComAcrescimo - (precoComAcrescimo * pctDesconto / 100);
    const q = carrinho[item.codigo] ? carrinho[item.codigo].qtd : 0;

    const imgHtml = item.imagem_oferta && item.imagem_oferta.trim() !== '' 
      ? `<img src="${item.imagem_oferta}" alt="${escapeHtml(item.subgrupo)}" onerror="this.onerror=null; this.parentElement.innerHTML='🖼️';">`
      : '🖼️';

    return `
      <div class="card-oferta">
        <div class="selo-desconto">-${pctDesconto}% OFF</div>
        <div class="img-box">
          ${imgHtml}
        </div>
        <div class="corpo-oferta">
          ${item.marca ? `<span class="marca-tag">${escapeHtml(item.marca)}</span>` : ''}
          <div class="titulo-prod">${escapeHtml(item.subgrupo)}</div>

          <div class="bloco-preco-balcao">
            <span class="txt-de">De: R$ ${fmtMoeda(precoComAcrescimo)}</span>
            <span class="txt-por">Por: R$ ${fmtMoeda(precoPromocional)}</span>
          </div>

          <button class="btn-add-oferta" onclick="adicionarOferta('${item.codigo}', '${escapeHtml(item.subgrupo).replace(/'/g, "\\'")}', ${item.preco_base}, '${item.imagem_oferta}')">
            🛒 ${q > 0 ? `No Pedido (${q})` : 'Adicionar ao Pedido'}
          </button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('gridOfertas').innerHTML = html;
}

function adicionarOferta(cod, desc, precoBase, img) {
  carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');
  const atual = carrinho[cod] ? carrinho[cod].qtd : 0;
  
  carrinho[cod] = { qtd: atual + 1, precoBase, desc, img };
  localStorage.setItem('carrinho_b2b', JSON.stringify(carrinho));
  
  renderizarEncate();

  // NOTIFICA O INDEX.HTML PAI PARA ATUALIZAR O CARRINHO PRINCIPAL
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ tipo: 'ATUALIZAR_CARRINHO' }, '*');
  }
}

init();
</script>
</body>
</html>
