<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ BLACK NOVEMBER MARINE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --azul-900:#001b3a; --azul-950:#020617;
    --sky-400:#38bdf8; --vermelho-600:#ef4444;
    --cinza-100:#f1f5f9; --cinza-200:#e2e8f0; --cinza-600:#475569;
  }
  body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6f9; color:#0f172a; min-height:100vh; padding: 12px; padding-bottom:90px; }
  button { font-family:inherit; cursor:pointer; }

  /* BANNER HERO BLACK NOVEMBER */
  .hero-black {
    background: linear-gradient(135deg, #001b3a 0%, #020617 100%);
    color: white; padding: 16px; text-align: center; position: relative;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); border-bottom: 3px solid #38bdf8;
    border-radius: 12px; margin-bottom: 16px; overflow: hidden;
  }
  .hero-black h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: #ffffff; }
  .hero-black h1 span { color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
  .hero-black p { font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-top: 2px; }

  /* CONTAINER PRINCIPAL */
  .encarte-container { max-width: 1400px; margin: 0 auto; }

  /* GRADE DE FAMÍLIAS E PRODUTOS (2 a 3 CARDS POR LINHA) */
  .grid-familias-ofertas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  @media (max-width: 768px) {
    .grid-familias-ofertas {
      grid-template-columns: 1fr;
    }
  }

  /* CARD DA FAMÍLIA REESTRUTURADO EM BLOCO VERTICAL COMPACTO */
  .card-oferta-pai {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,27,58,0.06);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card-oferta-pai:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,27,58,0.12);
  }

  /* CARRINHO FLUTUANTE QUE AVISA O PAI */
  .fab-carrinho {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--azul-900); color: white;
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    cursor: pointer; z-index: 150; border: 2px solid #38bdf8;
  }
  .fab-qtd {
    position: absolute; top: -4px; right: -4px;
    background: var(--vermelho-600); color: white;
    font-size: 11px; font-weight: 900; min-width: 20px; height: 20px;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    border: 2px solid white;
  }
</style>
</head>
<body>

<!-- TOPO CHAMATIVO EXCLUSIVO BLACK NOVEMBER -->
<header class="hero-black">
  <h1>⚡ BLACK NOVEMBER <span>MARINE</span> ⚡</h1>
  <p>OFERTAS ESPECIAIS B2B • ESTOQUE LIMITADO</p>
</header>

<main class="encarte-container">
  <div id="gridOfertas">
    <div style="text-align:center; padding:50px; color:#94a3b8; font-weight:700;">Carregando ofertas...</div>
  </div>
</main>

<!-- BOTÃO DO CARRINHO QUE ABRE O CARRINHO PRINCIPAL DO INDEX -->
<div class="fab-carrinho" id="btnCarrinho" onclick="abrirCarrinhoPai()" style="display:none;">
  🛒
  <div class="fab-qtd" id="qtdCarrinho">0</div>
</div>

<script>
let clienteLogado = JSON.parse(localStorage.getItem('cliente_b2b') || 'null');
let listaOfertas = [];
let carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtMoeda = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function init() {
  await carregarOfertas();
  atualizarCarrinho();
}

async function carregarOfertas() {
  try {
    const r = await fetch('/api/ofertas');
    const j = await r.json();

    if (!j.ok || !j.ofertas || j.ofertas.length === 0) {
      document.getElementById('gridOfertas').innerHTML = `<div style="text-align:center; padding:60px; color:#94a3b8;">Nenhuma oferta ativa no momento.</div>`;
      return;
    }

    const resCat = await fetch('/api/catalogo');
    const dataCat = await resCat.json();
    const mapaCatalogo = new Map();
    
    if (dataCat.ok && dataCat.itens) {
      dataCat.itens.forEach(it => mapaCatalogo.set(String(it.codigo), it));
    }

    listaOfertas = j.ofertas.map(of => {
      const cat = mapaCatalogo.get(String(of.codigo)) || {};
      const subgrupo = of.subgrupo || cat.subgrupo || cat.subgrupo_scraping || cat.descricao_sistema || `Produto ${of.codigo}`;
      const precoBase = Number(of.preco_base || cat.preco_venda || 0);
      const imagem = of.imagem_oferta || cat.imagem_url || '';
      const marca = of.marca || cat.marca || 'MARINE';
      const descItem = cat.descricao_sistema || cat.descricao_longa || '';

      return {
        ...of,
        subgrupo,
        preco_base: precoBase,
        imagem_oferta: imagem,
        marca,
        descricao_item: descItem
      };
    });

    renderizarEncateComGrip(listaOfertas);
  } catch (e) {
    document.getElementById('gridOfertas').innerHTML = `<div style="text-align:center; padding:60px; color:#ef4444;">Erro ao carregar ofertas.</div>`;
  }
}

// RENDERIZAÇÃO EM GRID COM 2 A 3 CARDS POR LINHA
function renderizarEncateComGrip(lista) {
  const container = document.getElementById('gridOfertas');
  if (!container) return;

  const grupos = {};
  lista.forEach(item => {
    const nomeSub = item.subgrupo || item.subgrupo_scraping || 'Geral';
    if (!grupos[nomeSub]) grupos[nomeSub] = [];
    grupos[nomeSub].push(item);
  });

  const familiasReais = {};
  const produtosIndividuais = [];

  Object.keys(grupos).forEach(nomeSub => {
    const itens = grupos[nomeSub];
    if (nomeSub === 'Individual' || nomeSub === 'Geral' || itens.length === 1) {
      produtosIndividuais.push(...itens);
    } else {
      familiasReais[nomeSub] = itens;
    }
  });

  let html = `<div class="grid-familias-ofertas">`;

  // 1. CARDS COMPACTOS DE FAMÍLIAS (LADO A LADO)
  Object.keys(familiasReais).forEach(nomeFamilia => {
    const itens = familiasReais[nomeFamilia];
    const desc = itens[0].desconto_porcentagem || itens[0].desconto || 0;
    const imgPai = itens[0].imagem_oferta || '';
    const marca = itens[0].marca || 'MARINE';

    html += `
      <div class="card-oferta-pai">
        
        <!-- TOPO CARD -->
        <div style="background: linear-gradient(90deg, #001b3a 0%, #0f172a 100%); color:white; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
          <span style="background:#ef4444; color:white; font-weight:900; padding:2px 8px; border-radius:4px; font-size:0.75rem;">
            🔥 -${desc}% OFF
          </span>
          <span style="color:#38bdf8; font-weight:900; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.5px;">
            ⚡ BLACK NOVEMBER
          </span>
        </div>

        <!-- CORPO COMPACTO DO CARD -->
        <div style="padding:12px; display:flex; flex-direction:column; align-items:center; text-align:center; flex:1; justify-content:space-between;">
          
          <div style="width:100px; height:100px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; display:flex; align-items:center; justify-content:center; margin-bottom:8px; padding:4px;">
            ${imgPai ? `<img src="${imgPai}" style="max-width:100%; max-height:100%; object-fit:contain;">` : '🖼️'}
          </div>

          <div>
            <h3 style="margin:0 0 4px 0; color:#001b3a; font-size:0.95rem; font-weight:800; line-height:1.2;">${escapeHtml(nomeFamilia)}</h3>
            <p style="margin:0 0 10px 0; color:#64748b; font-size:0.75rem;">
              Possui <strong>${itens.length} opções</strong> em promoção.
            </p>
          </div>

          <button style="width:100%; background:#001b3a; color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:800; font-size:0.8rem; cursor:pointer;" onclick="abrirModalFamiliaOferta('${escapeHtml(nomeFamilia).replace(/'/g, "\\'")}')">
            👁️ Ver Opções e Comprar
          </button>
        </div>

      </div>`;
  });

  html += `</div>`;

  // 2. OFERTAS INDIVIDUAIS
  if (produtosIndividuais.length > 0) {
    const acrescimo = clienteLogado?.acrescimo || 0;

    if (Object.keys(familiasReais).length > 0) {
      html += `<h3 style="color:#001b3a; margin: 24px 0 12px 0; font-size: 1.05rem; font-weight: 800;">📌 Ofertas Individuais</h3>`;
    }

    html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;">`;

    produtosIndividuais.forEach(item => {
      const precoComAcrescimo = item.preco_base + (item.preco_base * acrescimo / 100);
      const desc = Number(item.desconto_porcentagem || 0);
      const precoPromocional = precoComAcrescimo - (precoComAcrescimo * desc / 100);
      const q = carrinho[item.codigo] ? carrinho[item.codigo].qtd : 0;

      html += `
        <div style="background:white; border-radius:10px; border:1px solid #cbd5e1; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.04); display:flex; flex-direction:column; justify-content:space-between; position:relative; padding:10px;">
          
          <div style="position:absolute; top:6px; left:6px; background:#ef4444; color:white; font-weight:900; font-size:0.7rem; padding:2px 6px; border-radius:4px; z-index:2;">
            -${desc}%
          </div>

          <div style="width:100%; aspect-ratio:1; padding:8px; display:flex; align-items:center; justify-content:center; background:#fff;">
            ${item.imagem_oferta ? `<img src="${item.imagem_oferta}" style="max-width:100%; max-height:100%; object-fit:contain;">` : '🖼️'}
          </div>

          <div>
            <span style="font-size:0.65rem; font-weight:800; color:#001b3a; background:#e2e8f0; padding:1px 4px; border-radius:3px;">CÓD: ${item.codigo}</span>
            <h4 style="margin:4px 0; color:#0f172a; font-size:0.8rem; font-weight:800; line-height:1.2;">${escapeHtml(item.descricao_item || item.subgrupo)}</h4>
          </div>

          <div style="background:#fef2f2; border:1px dashed #fca5a5; padding:4px; border-radius:6px; text-align:center; margin:6px 0;">
            <span style="font-size:0.65rem; color:#94a3b8; text-decoration:line-through; font-weight:700; display:block;">De: R$ ${fmtMoeda(precoComAcrescimo)}</span>
            <span style="font-size:0.95rem; color:#ef4444; font-weight:900; display:block;">Por: R$ ${fmtMoeda(precoPromocional)}</span>
          </div>

          <button style="width:100%; background:#10b981; color:white; border:none; padding:6px; border-radius:6px; font-weight:800; font-size:0.75rem; cursor:pointer;" onclick="adicionarOferta('${item.codigo}', ${desc}, ${item.preco_base}, '${item.imagem_oferta}', '${escapeHtml(item.subgrupo).replace(/'/g, "\\'")}')">
            🛒 ${q > 0 ? `No Pedido (${q})` : 'Adicionar'}
          </button>

        </div>`;
    });

    html += `</div>`;
  }

  container.innerHTML = html;
}

function abrirModalFamiliaOferta(nomeSubgrupo) {
  const itensFam = listaOfertas.filter(i => (i.subgrupo || 'Geral') === nomeSubgrupo);
  if (!itensFam.length) return;

  const acrescimo = clienteLogado?.acrescimo || 0;
  document.getElementById('modalOfertaBg')?.remove();

  let modalHtml = `
    <div id="modalOfertaBg" style="position:fixed; inset:0; background:rgba(0,27,58,0.85); display:flex; align-items:center; justify-content:center; padding:16px; z-index:9999;">
      <div style="background:#ffffff; width:100%; max-width:650px; border-radius:12px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.4);">
        
        <div style="background:#001b3a; color:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="color:#38bdf8; font-size:0.7rem; font-weight:800; text-transform:uppercase;">⚡ BLACK NOVEMBER</span>
            <h3 style="margin:0; font-size:1rem; color:#ffffff;">${escapeHtml(nomeSubgrupo)}</h3>
          </div>
          <button onclick="document.getElementById('modalOfertaBg').remove()" style="background:none; border:none; color:white; font-size:1.4rem; cursor:pointer;">✕</button>
        </div>

        <div style="max-height:380px; overflow-y:auto; padding:12px;">
          ${itensFam.map(item => {
            const precoComAcrescimo = item.preco_base + (item.preco_base * acrescimo / 100);
            const desc = Number(item.desconto_porcentagem || 0);
            const precoFinal = precoComAcrescimo - (precoComAcrescimo * desc / 100);
            const q = carrinho[item.codigo] ? carrinho[item.codigo].qtd : 0;

            return `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #e2e8f0; gap:10px;">
                <div>
                  <strong style="color:#001b3a; font-size:0.85rem;">Cód: ${item.codigo}</strong>
                  <div style="color:#64748b; font-size:0.75rem;">${escapeHtml(item.descricao_item || item.subgrupo)}</div>
                </div>

                <div style="text-align:right;">
                  <div style="text-decoration:line-through; color:#94a3b8; font-size:0.65rem;">De: R$ ${fmtMoeda(precoComAcrescimo)}</div>
                  <strong style="color:#ef4444; font-size:0.95rem;">Por: R$ ${fmtMoeda(precoFinal)}</strong>
                </div>

                <button style="background:#10b981; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:800; cursor:pointer; font-size:0.75rem;" onclick="adicionarOferta('${item.codigo}', ${desc}, ${item.preco_base}, '${item.imagem_oferta}', '${escapeHtml(item.subgrupo).replace(/'/g, "\\'")}')">
                  🛒 ${q > 0 ? `(${q})` : '+ Adicionar'}
                </button>
              </div>`;
          }).join('')}
        </div>

      </div>
    </div>`;

  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function adicionarOferta(cod, desc, precoBase, img, nome) {
  const acrescimo = clienteLogado?.acrescimo || 0;
  const precoComAcrescimo = precoBase + (precoBase * acrescimo / 100);
  const precoComDesconto = precoComAcrescimo - (precoComAcrescimo * (desc / 100));

  carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');
  const qtdAtual = carrinho[cod] ? carrinho[cod].qtd : 0;

  carrinho[cod] = {
    codigo: cod,
    desc: nome || `Produto ${cod}`,
    qtd: qtdAtual + 1,
    precoBase: precoBase,
    desconto: desc,
    preco: precoComDesconto,
    img: img || ''
  };

  localStorage.setItem('carrinho_b2b', JSON.stringify(carrinho));
  atualizarCarrinho();

  // ENVIA MENSAGEM PARA O INDEX.HTML ATUALIZAR O CARRINHO PRINCIPAL
  if (window.parent) {
    window.parent.postMessage({ tipo: 'ATUALIZAR_CARRINHO' }, '*');
  }
}

function atualizarCarrinho() {
  carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');
  const qtdTotal = Object.values(carrinho).reduce((acc, i) => acc + i.qtd, 0);
  const btn = document.getElementById('btnCarrinho');
  if (qtdTotal > 0) {
    btn.style.display = 'flex';
    document.getElementById('qtdCarrinho').textContent = qtdTotal;
  } else {
    btn.style.display = 'none';
  }
}

function abrirCarrinhoPai() {
  if (window.parent) {
    window.parent.postMessage({ tipo: 'ABRIR_CARRINHO' }, '*');
  }
}

init();
</script>
</body>
</html>
