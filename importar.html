<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Importar Scraping - Marine</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px; max-width: 800px; margin: 0 auto; }
  h1 { color: #38bdf8; }
  label { display: block; margin-top: 20px; font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
  input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 14px; }
  input:focus { outline: none; border-color: #38bdf8; }
  button { background: #2563eb; font-weight: bold; cursor: pointer; margin-top: 24px; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .log { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-top: 20px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #a5b4fc; }
  .log .ok { color: #10b981; }
  .log .err { color: #ef4444; }
  .log .info { color: #38bdf8; }
  .progress { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .progress-bar { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<h1>🕷️ Importar Scraping (Marine)</h1>
<p style="color:#94a3b8; font-size:14px;">Cole o link da página de listagem. O script vai puxar os produtos e variações e baixar o JSON.</p>

<label>Link da Página (ex: carretilha)</label>
<input type="text" id="linkPagina" placeholder="https://loja.marinefishing.com.br/produtos/carretilha/filter?d=27" value="https://loja.marinefishing.com.br/produtos/carretilha/filter?d=27">

<label>Nome do Grupo (opcional)</label>
<input type="text" id="nomeGrupo" placeholder="Ex: CARRETILHAS (se vazio, tenta pelo link)">

<label>Páginas (Inicial e Final)</label>
<div style="display:flex; gap:10px;">
  <input type="number" id="pagIni" value="1" style="width:50%;">
  <input type="number" id="pagFim" value="6" style="width:50%;">
</div>

<label>Delay (ms) entre produtos</label>
<input type="number" id="delay" value="2000">

<button id="btnGerar" onclick="iniciarScraping()">▶️ Gerar JSON</button>

<div class="progress"><div class="progress-bar" id="barraProgresso"></div></div>
<div class="log" id="log"></div>

<script>
let todosProdutos = [];
let totalEsperado = 0;
let jaProcessados = 0;

function log(msg, tipo = 'info') {
  const el = document.getElementById('log');
  const p = document.createElement('div');
  p.className = tipo;
  p.textContent = msg;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function fetchHTML(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

function extrairLinkProdutos(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const links = new Set();
  doc.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.includes('/produto/') && href.endsWith('.html')) {
      links.add(href.startsWith('http') ? href : 'https://loja.marinefishing.com.br' + (href.startsWith('/') ? '' : '/') + href);
    }
  });
  return Array.from(links);
}

function extrairProduto(html, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  
  // Nome
  let nome = '';
  const h1 = doc.querySelector('h1');
  if (h1) nome = h1.textContent.trim();
  if (!nome) {
    const title = doc.querySelector('title');
    if (title) nome = title.textContent.split('-')[0].trim();
  }
  nome = nome.replace(/\s*[-|]\s*(Casa ?Japon|Marine).*$/i, '').trim();

  // Grupo
  let grupo = 'OUTROS';
  if (url.includes('/anzol-')) grupo = 'ANZOIS';
  else if (url.includes('/isca-')) grupo = 'ISCAS';
  else if (url.includes('/vara-')) grupo = 'VARAS';
  else if (url.includes('/molinete-')) grupo = 'MOLINETES';
  else if (url.includes('/carretilha-')) grupo = 'CARRETILHAS';
  else if (url.includes('/linha-')) grupo = 'LINHAS';
  else if (url.includes('/empate-') || url.includes('/cabo-')) grupo = 'EMPATES';
  else if (url.includes('/alicate-') || url.includes('/bolsa-')) grupo = 'ACESSORIOS';
  else if (url.includes('/motor-')) grupo = 'MOTORES';
  else if (url.includes('/vestuario-') || url.includes('/camisa-') || url.includes('/bone-')) grupo = 'VESTUARIO';

  // Marca
  let marca = 'MARINE';
  const htmlTexto = html;
  const matchMarca = htmlTexto.match(/MARCA\s*:\s*([A-Za-zÀ-ÿ0-9\-\.\s]+?)[<\n\r]/i);
  if (matchMarca) marca = matchMarca[1].trim();

  // Descrição
  let descricao = '';
  doc.querySelectorAll('p').forEach(p => {
    const txt = p.textContent.trim();
    if (txt.length > 20 && !txt.includes('login')) descricao += txt + '\n\n';
  });

  // Imagem principal
  let imagemPrincipal = '';
  doc.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (src.includes('/produtos/')) {
      imagemPrincipal = src.replace('/400/', '/1500/').replace('/800/', '/1500/');
    }
  });

  // Variações
  const variacoes = [];
  const tabelas = doc.querySelectorAll('table');
  tabelas.forEach(table => {
    const ths = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim().toUpperCase());
    if (!ths.some(t => t.includes('TAMANHO'))) return;

    const linhas = table.querySelectorAll('tbody tr');
    linhas.forEach(tr => {
      const tds = tr.querySelectorAll('td');
      if (tds.length < 4) return;

      let codigoVar = '', codBarrasVar = '', tamanho = '', qtd = '';
      const txtTds = Array.from(tds).map(td => td.textContent.trim());

      const idxCod = txtTds.findIndex(t => t.match(/\d{5,6}/));
      if (idxCod >= 0) {
        const htmlCod = tds[idxCod].innerHTML;
        const partes = htmlCod.replace(/<br\s*\/?>/gi, '|').replace(/<[^>]*>/g, '').split('|').map(s => s.trim()).filter(s => s);
        codigoVar = partes[0] || '';
        codBarrasVar = partes[1] || '';
      }
      const idxTam = txtTds.findIndex(t => t.match(/^(\d+\/\d+|\d+)$/));
      if (idxTam >= 0) tamanho = txtTds[idxTam];
      const idxQtd = txtTds.findIndex((t, idx) => idx > idxTam && t.match(/^\d+$/));
      if (idxQtd >= 0) qtd = txtTds[idxQtd];

      if (codigoVar) {
        variacoes.push({ imagem: imagemPrincipal, Tamanho: tamanho, QTD: qtd, codigo: codigoVar, cod_barras: codBarrasVar, 'CX/CT': 'CX' });
      }
    });
  });

  // Fallback se não achou variação
  if (variacoes.length === 0) {
    const matchCod = htmlTexto.match(/C[ÓO]DIGO\s*:\s*(\d+)/i);
    const codPrincipal = matchCod ? matchCod[1].trim() : '';
    const matchBarras = htmlTexto.match(/C[ÓO]DIGO\s+BARRAS\s*:\s*(\d+)/i);
    const codBarrasPrincipal = matchBarras ? matchBarras[1].trim() : '';
    if (codPrincipal) {
      variacoes.push({ imagem: imagemPrincipal, codigo: codPrincipal, cod_barras: codBarrasPrincipal });
    }
  }

  return { nome, grupo, marca, descricao, imagemPrincipal, variacoes };
}

async function iniciarScraping() {
  const btn = document.getElementById('btnGerar');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  todosProdutos = [];
  jaProcessados = 0;

  const linkBase = document.getElementById('linkPagina').value.trim();
  const nomeGrupoInput = document.getElementById('nomeGrupo').value.trim().toUpperCase();
  const pagIni = parseInt(document.getElementById('pagIni').value) || 1;
  const pagFim = parseInt(document.getElementById('pagFim').value) || 6;
  const delayMs = parseInt(document.getElementById('delay').value) || 2000;

  log(`🔗 Base: ${linkBase}`, 'info');
  log(`📄 Páginas: ${pagIni} até ${pagFim}`, 'info');

  // Passo 1: Coletar links de produtos de todas as páginas
  const todosLinks = [];
  for (let pagina = pagIni; pagina <= pagFim; pagina++) {
    let urlPagina = linkBase;
    if (pagina > 1) {
      urlPagina = linkBase.includes('?') ? `${linkBase}&pagina=${pagina}` : `${linkBase}?pagina=${pagina}`;
    }
    
    log(`\n📄 Buscando página ${pagina}...`, 'info');
    try {
      const html = await fetchHTML(urlPagina);
      const links = extrairLinkProdutos(html);
      log(`   → ${links.length} produtos encontrados`, 'ok');
      links.forEach(l => todosLinks.push(l));
      await delay(delayMs);
    } catch (e) {
      log(`   ❌ Erro: ${e.message}`, 'err');
    }
  }

  const linksUnicos = [...new Set(todosLinks)];
  totalEsperado = linksUnicos.length;
  log(`\n📦 Total de produtos únicos: ${totalEsperado}`, 'info');

  // Passo 2: Baixar cada produto e extrair
  for (let i = 0; i < linksUnicos.length; i++) {
    const urlProduto = linksUnicos[i];
    log(`[${i + 1}/${totalEsperado}] Buscando produto...`, 'info');
    
    try {
      const html = await fetchHTML(urlProduto);
      const prod = extrairProduto(html, urlProduto);
      
      if (prod.variacoes.length === 0) {
        log(`   ⚠️ Sem variações (${prod.nome})`, 'err');
        continue;
      }

      for (const v of prod.variacoes) {
        if (!v.codigo) continue;
        const attrs = { ...v };
        delete attrs.codigo;
        delete attrs.cod_barras;
        delete attrs.imagem;

        todosProdutos.push({
          site: 'marine',
          grupo: nomeGrupoInput || prod.grupo,
          subgrupo: prod.nome,
          marca: prod.marca,
          descricao_longa: prod.descricao,
          url_origem: urlProduto,
          codigo: v.codigo,
          cod_barras: v.cod_barras || '',
          imagem_url: v.imagem || prod.imagemPrincipal,
          atributos_json: JSON.stringify(attrs)
        });
      }
      
      log(`   ✅ ${prod.nome} (${prod.variacoes.length} var)`, 'ok');
    } catch (e) {
      log(`   ❌ Erro: ${e.message}`, 'err');
    }
    
    jaProcessados++;
    const progresso = (jaProcessados / totalEsperado) * 100;
    document.getElementById('barraProgresso').style.width = progresso + '%';
    
    await delay(delayMs);
  }

  // Passo 3: Baixar o JSON
  if (todosProdutos.length > 0) {
    const nomeArquivo = `scraping_${nomeGrupoInput || 'completo'}_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
    
    const blob = new Blob([JSON.stringify(todosProdutos, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    a.click();
    URL.revokeObjectURL(url);

    log(`\n✅ Concluído! Arquivo "${nomeArquivo}" gerado com ${todosProdutos.length} itens.`, 'ok');
  } else {
    log('\n❌ Nenhum produto foi salvo.', 'err');
  }

  btn.disabled = false;
}
</script>
</body>
</html>
