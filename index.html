<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Tabela de Preços</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --azul-900:#001f3f; --azul-800:#003366; --azul-700:#004080;
    --azul-500:#2563eb; --azul-100:#dbeafe; --azul-50:#eff6ff;
    --branco:#ffffff; --cinza-50:#f8fafc; --cinza-100:#f1f5f9;
    --cinza-200:#e2e8f0; --cinza-300:#cbd5e1; --cinza-400:#94a3b8;
    --cinza-500:#64748b; --cinza-700:#334155; --texto:#1a2a3a;
    --verde:#10b981; --verde-hover:#059669;
    --vermelho:#ef4444; --vermelho-suave:#fee2e2;
  }
  body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:var(--cinza-50); color:var(--texto); -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom: 90px; }
  button { font-family:inherit; cursor:pointer; }

  /* LOGIN */
  #telaLogin { position:fixed; inset:0; z-index:9999; background:linear-gradient(135deg, #001f3f 0%, #003366 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { background:white; border-radius:16px; padding:40px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.4); text-align:center; }
  .login-box h1 { color:var(--azul-800); font-size:1.5rem; font-weight:800; margin-bottom:8px; }
  .login-box p { color:var(--cinza-500); font-size:.9rem; margin-bottom:24px; }
  .login-box input { width:100%; padding:14px 16px; border:2px solid var(--cinza-200); border-radius:10px; font-size:1.1rem; text-align:center; font-weight:700; letter-spacing:1px; margin-bottom:16px; }
  .login-box input:focus { outline:none; border-color:var(--azul-500); }
  .login-box button { width:100%; padding:14px; background:var(--azul-800); color:white; border:none; border-radius:10px; font-size:1rem; font-weight:800; transition:.2s; }
  .login-box button:hover { background:var(--azul-700); }
  .login-erro { color:var(--vermelho); font-size:.85rem; font-weight:700; margin-bottom:12px; display:none; }

  /* TOPO */
  .topo { background:linear-gradient(135deg, #001f3f 0%, #003366 100%); color:white; position:sticky; top:0; z-index:100; box-shadow:0 4px 24px rgba(0,51,102,.25); }
  .topo-inner { max-width:1500px; margin:0 auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .topo-logo-area strong { font-size:1.1rem; font-weight:800; letter-spacing:-.3px; }
  
  /* INFO CLIENTE MINIMALISTA */
  .info-cliente { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.1); padding:6px 12px; border-radius:20px; font-size:.75rem; font-weight:700; }
  .info-cliente span.uf { background:var(--verde); color:white; padding:2px 6px; border-radius:4px; }

  .busca-wrap { flex:1; min-width:200px; max-width:420px; }
  .busca-wrap input { width:100%; padding:11px 16px; border:none; border-radius:12px; font-family:inherit; font-size:.9rem; background:rgba(255,255,255,.12); color:white; }
  .busca-wrap input::placeholder { color:rgba(255,255,255,.55); }
  .busca-wrap input:focus { outline:none; background:rgba(255,255,255,.2); }

  /* CHIPS */
  .chips-wrap { background:white; border-bottom:1px solid var(--cinza-100); position:sticky; top:62px; z-index:90; overflow-x:auto; }
  .chips { max-width:1500px; margin:0 auto; padding:12px 20px; display:flex; gap:8px; flex-wrap:nowrap; }
  .chip { padding:9px 16px; border-radius:20px; background:var(--cinza-100); border:1px solid transparent; color:var(--cinza-700); font-size:.82rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:.2s; text-transform:uppercase; }
  .chip:hover { background:var(--cinza-200); }
  .chip.ativo { background:linear-gradient(135deg, var(--azul-800), var(--azul-700)); color:white; border-color:var(--azul-800); }
  .chip small { opacity:.6; margin-left:4px; }

  /* CONTEÚDO PRINCIPAL */
  .conteudo { padding:20px; max-width:1500px; margin:0 auto; }
  .loading { text-align:center; padding:80px 20px; color:var(--cinza-400); }
  
  .familia-bloco { margin-bottom:24px; }
  .familia-head { display:flex; align-items:baseline; gap:12px; padding-bottom:10px; margin-bottom:12px; border-bottom:2px solid var(--azul-100); }
  .familia-head h2 { color:var(--azul-800); font-size:1.2rem; font-weight:800; }
  .familia-head .marca-badge { background:var(--azul-50); color:var(--azul-800); padding:4px 10px; border-radius:20px; font-size:.7rem; font-weight:800; text-transform:uppercase; }

  .sub-grupo-header { background: var(--azul-50); color: var(--azul-800); padding: 8px 14px; border-radius: 6px; border-left: 4px solid var(--azul-500); font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; margin-bottom: 8px; }
  
  /* CARDS (Otimizados para não ter lixo visual) */
  .familia-card, .isca-card, .anzol-card, .molinete-card { display:grid; grid-template-columns:200px 1fr; gap:20px; background:white; border:1px solid var(--cinza-200); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
  .familia-side { display:flex; flex-direction:column; gap:12px; }
  .familia-foto-principal { background:var(--cinza-50); border:1px solid var(--cinza-100); border-radius:10px; padding:12px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .familia-foto-principal img { max-width:100%; max-height:100%; object-fit:contain; }
  
  .btn-detalhes { background:var(--cinza-50); border:1px solid var(--cinza-200); color:var(--azul-800); border-radius:6px; font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:6px 10px; margin-bottom:12px; align-self:flex-start; transition: .2s; }
  .btn-detalhes:hover { background:var(--azul-50); border-color:var(--azul-300); }

  /* MINIATURAS */
  .topo-miniaturas { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--cinza-100); }
  .filho-mini { width: 80px; background:white; border:2px solid var(--cinza-200); border-radius:6px; padding:4px; cursor:pointer; transition:.2s; display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
  .filho-mini img { width:100%; aspect-ratio:1; object-fit:contain; margin-bottom:4px; }
  .mini-info { width:100%; text-align:center; line-height:1.1; }
  .mini-nome { font-size:.55rem; font-weight:800; color:var(--azul-800); text-transform:uppercase; display:block; }
  .filho-mini:hover, .filho-mini.ativa { border-color:var(--azul-800); box-shadow:0 2px 6px rgba(0,51,102,.1); }
  .filho-mini.ativa { background:var(--azul-50); }

  /* TABS */
  .isca-modelos-tabs, .anzol-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--cinza-200); padding-bottom:12px; }
  .isca-modelo-btn, .anzol-tab { padding:6px 14px; border-radius:6px; border:1px solid var(--cinza-200); background:var(--cinza-50); color:var(--azul-800); font-size:.8rem; font-weight:800; cursor:pointer; transition:.2s; text-transform:uppercase; }
  .isca-modelo-btn:hover, .anzol-tab:hover { background:var(--azul-100); }
  .isca-modelo-btn.ativo, .anzol-tab.ativo { background:var(--azul-800); color:white; border-color:var(--azul-800); }
  .isca-titulo-cores { font-size:.75rem; font-weight:800; color:var(--cinza-500); text-transform:uppercase; margin-bottom:10px; }
  
  /* GRADES (ANZÓIS E ISCAS) */
  .isca-grade, .anzol-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px; }
  .isca-cor-card, .anzol-numero-card { background:white; border:1px solid var(--cinza-200); border-radius:8px; padding:8px; cursor:pointer; transition:.2s; display:flex; flex-direction:column; align-items:center; position:relative; }
  .isca-cor-card:hover, .anzol-numero-card:hover { border-color:var(--azul-500); }
  .isca-cor-card.ativa, .anzol-numero-card.ativa { border-color:var(--azul-800); box-shadow:0 0 0 1px var(--azul-800); }
  .isca-cor-card img { width:100%; aspect-ratio:1; object-fit:contain; margin-bottom:4px; }
  .isca-cor-card .cor-nome, .anzol-numero { font-size:.8rem; font-weight:800; color:var(--texto); text-align:center; }
  .anzol-numero { font-size:1.4rem; color:var(--azul-800); line-height:1; margin-bottom:4px; }
  .isca-cor-card .cor-preco, .anzol-preco { font-size:.75rem; font-weight:800; color:var(--verde); margin-top:2px; }

  /* BADGES DE QTD */
  .isca-badge, .anzol-badge { position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; background:var(--verde); color:white; border-radius:10px; font-size:11px; font-weight:900; display:none; align-items:center; justify-content:center; border:2px solid white; z-index:3; }
  .isca-cor-card.tem-qtd .isca-badge, .anzol-numero-card.tem-qtd .anzol-badge { display:flex; }
  .isca-cor-card.tem-qtd, .anzol-numero-card.tem-qtd { border-color:var(--verde); background:#f0fdf4; }
  
  /* CONTROLES DE QUANTIDADE */
  .isca-qtd-ctrl, .anzol-qtd-ctrl { display:flex; align-items:center; gap:2px; margin-top:6px; width:100%; justify-content:center; }
  .isca-qtd-ctrl button, .anzol-qtd-ctrl button { width:24px; height:24px; border-radius:4px; border:1px solid var(--cinza-300); background:white; font-weight:800; color:var(--azul-800); }
  .isca-qtd-ctrl input, .anzol-qtd-ctrl input { width:28px; height:24px; border:1px solid var(--cinza-300); border-radius:4px; text-align:center; font-weight:800; -moz-appearance:textfield; color:var(--azul-800); }

  /* LISTAS (MOLINETES, VARA, ETC) */
  .lista-filhos { display:flex; flex-direction:column; gap:2px; }
  .lista-header { display:grid; grid-template-columns: 60px 1fr 200px 80px 90px; gap:8px; padding:0 10px 6px; font-size:.6rem; font-weight:800; color:var(--cinza-400); text-transform:uppercase; border-bottom:1px solid var(--cinza-200); }
  .lista-header div:nth-child(3), .lista-header div:nth-child(4), .lista-header div:nth-child(5) { text-align:center; }
  .linha-filho { display:grid; grid-template-columns: 60px 1fr 200px 80px 90px; gap:8px; align-items:center; padding:8px 10px; border-radius:6px; background:var(--cinza-50); margin-bottom:2px; transition:.15s; }
  .linha-filho:hover { background:white; border:1px solid var(--azul-100); box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .l-cod { font-family:monospace; font-weight:800; color:var(--azul-800); font-size:.75rem; }
  .l-nome { font-size:.8rem; font-weight:700; color:var(--texto); }
  .l-var-col { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .tag-var { background:#e0e7ff; color:#3730a3; padding:2px 6px; border-radius:4px; font-size:.6rem; font-weight:700; text-transform:uppercase; text-align:center; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .l-preco { font-size:.85rem; font-weight:800; color:var(--azul-800); text-align:center; }
  .l-qtd { display:flex; justify-content:center; }

  .qtd-ctrl { display:inline-flex; align-items:center; border:1px solid var(--cinza-300); border-radius:6px; background:white; }
  .qtd-ctrl button { width:24px; height:24px; border:none; background:transparent; font-weight:800; color:var(--azul-800); }
  .qtd-ctrl button:hover { background:var(--azul-50); }
  .qtd-ctrl input { width:28px; text-align:center; border:none; font-weight:800; color:var(--azul-800); -moz-appearance:textfield; font-size:.8rem; }
  .qtd-ctrl input:focus { outline:none; }

  .grade-soltos { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px; }
  .card-solto { background:white; border:1px solid var(--cinza-200); border-radius:8px; padding:12px; text-align:center; }
  .card-solto .img { width:100%; aspect-ratio:1; background:var(--cinza-50); display:flex; align-items:center; justify-content:center; border-radius:6px; margin-bottom:8px; font-size:2rem; color:var(--cinza-300); overflow:hidden; }
  .card-solto .img img { width:100%; height:100%; object-fit:contain; }
  .card-solto .nome { font-size:.75rem; font-weight:700; color:var(--azul-800); margin-bottom:4px; line-height:1.2; }
  .card-solto .preco { font-size:.85rem; font-weight:800; color:var(--verde); }

  /* =========================================
     CARRINHO FLUTUANTE (FAB) - O Segredo da Limpeza
     ========================================= */
  .fab-carrinho { position:fixed; bottom:24px; right:24px; background:var(--azul-800); color:white; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 4px 16px rgba(0,51,102,0.4); cursor:pointer; z-index:150; transition:transform 0.2s; }
  .fab-carrinho:hover { transform:scale(1.05); }
  .fab-qtd { position:absolute; top:-5px; right:-5px; background:var(--vermelho); color:white; font-size:12px; font-weight:900; min-width:22px; height:22px; border-radius:11px; display:flex; align-items:center; justify-content:center; border:2px solid white; }

  /* PAINEL DO CARRINHO (Abre só ao clicar) */
  .painel-carrinho { position:fixed; bottom:100px; right:24px; width:340px; max-width:calc(100vw - 48px); background:white; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.2); z-index:200; display:none; flex-direction:column; overflow:hidden; border:1px solid var(--cinza-200); }
  .painel-carrinho.on { display:flex; animation: fadeUp 0.2s ease-out; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  
  .painel-head { background:var(--azul-800); color:white; padding:12px 16px; font-weight:800; font-size:.9rem; display:flex; justify-content:space-between; align-items:center; }
  .painel-head button { background:none; border:none; color:white; font-size:1.2rem; cursor:pointer; }
  
  .painel-lista { padding:12px; max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .item-carrinho { display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; padding:8px; background:var(--cinza-50); border-radius:6px; font-size:.8rem; }
  .item-carrinho img { width:30px; height:30px; object-fit:contain; }
  .item-carrinho .dados { display:flex; flex-direction:column; }
  .item-carrinho .titulo { font-weight:700; color:var(--texto); line-height:1.1; margin-bottom:2px; }
  .item-carrinho .preco { font-weight:800; color:var(--verde); font-size:.75rem; }
  .item-carrinho .acoes { display:flex; align-items:center; gap:6px; }
  .item-carrinho button { background:none; border:none; color:var(--vermelho); font-weight:bold; cursor:pointer; font-size:1rem; }

  .painel-foot { padding:16px; border-top:1px solid var(--cinza-200); background:white; }
  .total-linha { display:flex; justify-content:space-between; font-weight:800; font-size:1.1rem; margin-bottom:12px; color:var(--azul-800); }
  .btn-finalizar { width:100%; background:var(--verde); color:white; border:none; padding:12px; border-radius:8px; font-weight:800; font-size:1rem; cursor:pointer; transition:.2s; }
  .btn-finalizar:hover { background:var(--verde-hover); }

  /* MODAL DE DETALHES */
  .modal-bg { position:fixed; inset:0; z-index:500; background:rgba(0,15,30,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:.25s; }
  .modal-bg.on { opacity:1; pointer-events:auto; }
  .modal { background:white; border-radius:12px; max-width:600px; width:100%; max-height:85vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 80px rgba(0,0,0,.5); }
  .modal-head { background:var(--azul-800); color:white; padding:16px; display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3 { font-size:.95rem; font-weight:800; }
  .modal-x { background:rgba(255,255,255,.15); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; }
  .modal-body { padding:20px; overflow-y:auto; }
  .modal-body p { font-size:.9rem; color:var(--cinza-700); line-height:1.6; white-space:pre-wrap; }

    @media(max-width: 800px) {
  /* TOPO DO CELULAR (Nome + Busca na mesma linha) */
  .topo-inner { padding: 10px 12px; flex-direction: row; flex-wrap: nowrap; gap: 8px; }
  .topo-logo-area { display: none; }
  .info-cliente { 
    flex: 1; padding: 8px 12px; justify-content: center; font-size: .75rem; 
    border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
  }
  .busca-wrap { flex: 1; min-width: 0; max-width: none; }
  .busca-wrap input { padding: 8px 12px; font-size: .85rem; }
  
  /* CHIPS */
  .chips-wrap { top: 58px; }
  .chips { padding: 10px 12px; }
  
  body { padding-bottom: 100px; }
  
  /* CARDS GERAIS (EMPILHADOS) */
  .familia-card, .isca-card, .anzol-card, .molinete-card { 
    display: flex !important; 
    flex-direction: column !important; 
    grid-template-columns: 1fr; 
    padding: 12px; 
    gap: 12px; 
  }
  .familia-side { 
    width: 100%; 
    display: flex; 
    flex-direction: column;
    align-items: center;
    margin-bottom: 8px; 
  }
  .familia-foto-principal { max-width: 140px; padding: 8px; margin: 0 auto; }
  
  .molinete-info, .anzol-info, .isca-info, .familia-info { width: 100%; }

  /* MOLINETES E CARRETILHAS - LINHA ÚNICA E INTUITIVA */
  .lista-header { display: none; } 
  
  /* LINHA ÚNICA LIMPA (DESKTOP E MOBILE) */
.lista-filhos { display: flex; flex-direction: column; gap: 4px; }

.linha-filho { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  gap: 12px; 
  padding: 8px 12px; 
  background: white; 
  border: 1px solid var(--cinza-200); 
  border-radius: 8px; 
  transition: .15s;
}

.linha-filho:hover { 
  border-color: var(--azul-500); 
  box-shadow: 0 2px 6px rgba(0,0,0,.04); 
}

.l-info-main { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  flex: 1; 
  min-width: 0; 
}

.l-cod { 
  font-family: monospace; 
  font-weight: 800; 
  color: var(--cinza-500); 
  font-size: .75rem; 
  background: var(--cinza-100); 
  padding: 2px 6px; 
  border-radius: 4px; 
  white-space: nowrap; 
}

.l-nome { 
  font-size: .85rem; 
  font-weight: 800; 
  color: var(--azul-800); 
  white-space: nowrap; 
  overflow: hidden; 
  text-overflow: ellipsis; 
}

.l-preco { 
  font-size: .95rem; 
  font-weight: 900; 
  color: var(--verde); 
  white-space: nowrap; 
  margin: 0 8px; 
}

.l-qtd { 
  display: flex; 
  align-items: center; 
}

/* CONTROLE DE QTD COMPACTO */
.qtd-ctrl { 
  display: inline-flex; 
  align-items: center; 
  border: 1px solid var(--cinza-300); 
  border-radius: 6px; 
  background: white; 
  overflow: hidden; 
}

.qtd-ctrl button { 
  width: 28px; 
  height: 28px; 
  border: none; 
  background: var(--cinza-50); 
  font-weight: 800; 
  color: var(--azul-800); 
  font-size: 1rem; 
}

.qtd-ctrl button:hover { background: var(--azul-100); }

.qtd-ctrl input { 
  width: 32px; 
  height: 28px; 
  text-align: center; 
  border: none; 
  font-weight: 800; 
  color: var(--azul-800); 
  font-size: .85rem; 
}

/* AJUSTES RESPONSIVOS MOBILE */
@media(max-width: 800px) {
  .familia-card, .molinete-card { 
    display: flex !important; 
    flex-direction: column !important; 
    padding: 10px !important; 
  }

  .familia-side { 
    width: 100%; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }

  .familia-foto-principal { max-width: 120px; }

  .linha-filho { 
    padding: 6px 8px; 
    gap: 6px; 
  }

  .l-cod { display: none; } /* Esconde o código no mobile para economizar espaço */

  .l-nome { font-size: .8rem; }

  .l-preco { font-size: .85rem; }

  .qtd-ctrl button { width: 24px; height: 24px; font-size: .9rem; }
  .qtd-ctrl input { width: 26px; height: 24px; font-size: .8rem; }
}

  /* AJUSTES PARA ISCAS E ANZÓIS */
  .isca-grade, .anzol-grade { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
  .isca-cor-card, .anzol-numero-card { padding: 8px !important; }
  .isca-cor-card .qtd-ctrl button, .anzol-numero-card .qtd-ctrl button { width: 24px; height: 24px; }
  .isca-cor-card .qtd-ctrl input, .anzol-numero-card .qtd-ctrl input { height: 24px; width: 26px; }
  
  /* CARRINHO FLUTUANTE */
  .fab-carrinho { bottom: 16px; right: 16px; width: 56px; height: 56px; }
  .painel-carrinho { bottom: 84px; right: 16px; width: calc(100vw - 32px); }
}
</style>
</head>
<body>

<div id="telaLogin">
  <div class="login-box">
    <h1>Catálogo B2B</h1>
    <p>Digite o seu CNPJ para acessar a tabela de preços.</p>
    <div class="login-erro" id="loginErro">CNPJ não encontrado ou inativo.</div>
    <input type="text" id="inputCnpj" placeholder="00.000.000/0000-00" autocomplete="off">
    <button onclick="fazerLogin()">Acessar Catálogo</button>
  </div>
</div>

<header class="topo">
  <div class="topo-inner">
    <div class="topo-logo-area"><strong>📋 Catálogo</strong></div>
    
    <div class="info-cliente" id="infoCliente" style="display:none;">
      <span id="nomeCliente">—</span>
      <span class="uf" id="badgeUf">—</span>
    </div>

    <div class="busca-wrap"><input type="search" id="busca" placeholder="Buscar produto..." autocomplete="off"></div>
  </div>
</header>

<div class="chips-wrap"><div class="chips" id="chips"></div></div>

<main class="conteudo" id="conteudo">
  <div class="loading">Carregando catálogo…</div>
</main>

<!-- CARRINHO FLUTUANTE (SÓ APARECE SE TIVER ITEM) -->
<div class="fab-carrinho" id="btnCarrinho" onclick="toggleCarrinho()" style="display:none;">
  🛒
  <div class="fab-qtd" id="topoQtd">0</div>
</div>

<!-- PAINEL DO CARRINHO -->
<div class="painel-carrinho" id="painelCarrinho">
  <div class="painel-head">
    <span>Seu Pedido</span>
    <button onclick="toggleCarrinho()">✕</button>
  </div>
  <div class="painel-lista" id="listaCarrinho"></div>
  <div class="painel-foot">
    <div class="total-linha">
      <span>Total:</span>
      <span id="carrinhoTotal">R$ 0,00</span>
    </div>
    <button class="btn-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="fecharModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modalTitulo">—</h3>
      <button class="modal-x" onclick="fecharModal(null, true)">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let todosItens = [], todasFamilias = [], grupoAtual = '__TODOS__', buscaAtual = '', carrinho = {};
let clienteLogado = null;
let porcentagemAcrescimo = 0;

const fmtMoeda = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const parseAtributos = json => { try { return JSON.parse(json || '{}'); } catch { return {}; } };

function calcularPrecoFinal(precoBase) {
  if (!precoBase) return 0;
  const acrescimo = (precoBase * porcentagemAcrescimo) / 100;
  return precoBase + acrescimo;
}

function normalizarItem(it) {
  return {
    codigo: String(it.codigo ?? ''),
    subgrupo: (it.subgrupo_scraping || '').trim(), 
    descricao_longa: it.descricao_longa || '', 
    imagem_url: it.imagem_url || '',
    precoBase: Number(it.preco_venda) || 0,
    get preco() { return calcularPrecoFinal(this.precoBase); },
    grupo: (it.grupo_scraping || '').trim(),
    marca: (it.marca || '').trim(),
    atributos: parseAtributos(it.atributos_json),
    estoque: Number(it.estoque) || 0,
    ordem_excel: Number(it.ordem_excel) || 999999,
    ordem_customizada_pos: 999999
  };
}

// ==========================================
// FUNÇÕES DE ANÁLISE
// ==========================================
function analisarAnzol(it) {
  const attrs = it.atributos || {};
  
  // Busca o número do anzol
  let numero = 'S/N';
  if (attrs['Tamanho (cm)']) numero = attrs['Tamanho (cm)'];
  else if (attrs['Tamanho']) numero = attrs['Tamanho'];
  else if (attrs['TAMANHO']) numero = attrs['TAMANHO'];
  
  if (numero === 'S/N') {
    const match = (it.subgrupo || '').toUpperCase().match(/\s(\d{1,2}(?:\/\d)?)\s*(?:C\/|\s|$)/);
    if (match) numero = match[1];
  }

  // Busca a Quantidade (tenta várias nomenclaturas comuns do scraping)
  let qtd = '';
  const chavesQtd = ['Quantidade', 'QUANTIDADE', 'Qtd', 'QTD', 'Qtd. Embalagem', 'Qtd Embalagem', 'Quantidade (un)'];
  for (let k of chavesQtd) {
    if (attrs[k]) { qtd = String(attrs[k]); break; }
  }
  // Se achou a quantidade, formata (ex: "15 un")
  if (qtd && !qtd.toLowerCase().includes('un')) qtd = qtd + ' un';

  return { numero, qtd };
}

function analisarMolinete(it) {
  const attrs = it.atributos || {};
  let modelo = attrs['Modelo'] || attrs['MODELO'] || '';
  const relacao = attrs['Relação de recolhimento'] || '';
  const capacidade = attrs['Capacidade de linha (mm-m)'] || '';
  const ladoManivela = attrs['Lado Manivela'] || attrs['LADO MANIVELA'] || '';
  const velMax = attrs['Velocidade Máxima'] || '';

  if (!modelo) {
    const partes = (it.subgrupo || '').trim().split(/\s+/);
    modelo = partes.slice(-2).join(' ') || it.subgrupo;
  }
  const partesVar = [];
  if (relacao) partesVar.push(relacao);
  if (capacidade) partesVar.push(capacidade);
  if (ladoManivela) partesVar.push(ladoManivela);
  if (velMax) partesVar.push(velMax);
  const variacao = partesVar.join(' • ');
  return { modelo, relacao, capacidade, ladoManivela, variacao };
}

// ==========================================
// LOGIN
// ==========================================
async function fazerLogin() {
  const cnpjInput = document.getElementById('inputCnpj');
  const cnpj = cnpjInput.value.replace(/\D/g, '');
  const erro = document.getElementById('loginErro');
  
  if (cnpj.length < 11) { erro.textContent = 'Digite um CNPJ válido.'; erro.style.display = 'block'; return; }

  try {
    const r = await fetch('/api/login/' + cnpj);
    const j = await r.json();

    if (!j.ok) { erro.textContent = j.erro || 'Erro ao validar CNPJ.'; erro.style.display = 'block'; return; }

    clienteLogado = j.cliente;
    porcentagemAcrescimo = j.regra_acrescimo.porcentagem;

    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('infoCliente').style.display = 'flex';
    document.getElementById('nomeCliente').textContent = clienteLogado.nome;
    document.getElementById('badgeUf').textContent = clienteLogado.uf;

    carregar();
  } catch (e) {
    erro.textContent = 'Erro de conexão.';
    erro.style.display = 'block';
  }
}

async function finalizarPedido() {
  const itens = Object.keys(carrinho).map(cod => {
    const item = carrinho[cod];
    const precoFinal = calcularPrecoFinal(item.precoBase);
    return { codigo: cod, desc: item.desc, qtd: item.qtd, precoBase: item.precoBase, precoFinal: precoFinal };
  });

  if (itens.length === 0) { alert('Seu carrinho está vazio.'); return; }
  const total = itens.reduce((acc, it) => acc + (it.precoFinal * it.qtd), 0);
  if (!confirm(`Deseja enviar este pedido no valor de R$ ${fmtMoeda(total)}?`)) return;

  try {
    const r = await fetch('/api/pedidos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cnpj_cliente: clienteLogado.cnpj, codigo_representante: clienteLogado.representante, total, itens })
    });
    const j = await r.json();
    if (j.ok) {
      alert('✅ Pedido enviado com sucesso!');
      carrinho = {}; atualizarCarrinho(); fecharCarrinho();
    } else { alert('❌ Erro: ' + j.erro); }
  } catch (e) { alert('❌ Erro ao enviar o pedido.'); }
}

async function carregar() {
  try {
    const rf = await fetch('/api/familias'); const jf = await rf.json();
    if (jf.ok) todasFamilias = jf.familias;
    const r = await fetch('/api/catalogo'); const j = await r.json();
    if (!j.ok) throw new Error('Erro API');
    
    todosItens = j.itens.map(normalizarItem).filter(it => it.grupo.length > 0 && it.estoque > 0);
    montarChips(); renderizar();
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="loading">Erro ao carregar.</div>';
  }
}

function montarChips() {
  const contagem = {};
  todosItens.forEach(it => contagem[it.grupo] = (contagem[it.grupo] || 0) + 1);
  const grupos = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a]);
  document.getElementById('chips').innerHTML = `
    <button class="chip ativo" onclick="trocarGrupo('__TODOS__', this)">Todos <small>${todosItens.length}</small></button>
    ${grupos.map(g => `<button class="chip" onclick="trocarGrupo('${g}', this)">${g} <small>${contagem[g]}</small></button>`).join('')}
  `;
}

function trocarGrupo(grupo, btn) {
  grupoAtual = grupo;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  btn.classList.add('ativo'); renderizar();
}

function filtrar() {
  let lista = todosItens;
  if (grupoAtual !== '__TODOS__') lista = lista.filter(it => it.grupo === grupoAtual);
  if (buscaAtual) {
    const q = buscaAtual.toLowerCase();
    lista = lista.filter(it => it.codigo.includes(q) || it.subgrupo.toLowerCase().includes(q) || it.marca.toLowerCase().includes(q));
  }
  return lista;
}

function renderizar() {
  const lista = filtrar();
  const cont = document.getElementById('conteudo');
  if (!lista.length) { cont.innerHTML = '<div class="loading">Nenhum produto encontrado.</div>'; return; }
  const processados = new Set(); let html = '';

  todasFamilias.forEach(fam => {
    const filhos = lista.filter(it => fam.itens.includes(it.codigo));
    if (filhos.length > 0) {
      if (fam.ordem_customizada && fam.ordem_customizada.length > 0) {
        filhos.forEach(f => {
          const pos = fam.ordem_customizada.indexOf(f.subgrupo);
          if (pos !== -1) f.ordem_customizada_pos = pos;
        });
      }

      let tipo = 'comum';
      const primeiroItem = filhos[0];
      const attrs = Object.keys(primeiroItem.atributos).map(k => k.toUpperCase());
      const grupoItem = primeiroItem.grupo.toUpperCase();
      const nomeFam = fam.nome.toUpperCase();

      if (nomeFam.includes('VARA')) tipo = 'vara';
      else if (nomeFam.includes('LINHA')) tipo = 'linha';
      else if (nomeFam.includes('EMPATE')) tipo = 'empate';
      else if (
        grupoItem.includes('ACESSORIO') || grupoItem.includes('VESTUARIO') || grupoItem.includes('MOTOR') || 
        nomeFam.includes('ACESSORIO') || nomeFam.includes('ALICATE') || nomeFam.includes('TESOURA') || 
        nomeFam.includes('VESTUARIO') || nomeFam.includes('MOTOR')
      ) { tipo = 'grade'; }
      else if (nomeFam.includes('ISCA') || attrs.includes('CORES') || attrs.includes('COR')) tipo = 'isca';
      else if (nomeFam.includes('ANZOL')) tipo = 'anzol';
      else if (nomeFam.includes('MOLINETE')) tipo = 'molinete';
      else if (nomeFam.includes('CARRETILHA')) tipo = 'carretilha';
      
      if (tipo === 'isca') html += renderFamiliaIsca(fam, filhos);
      else if (tipo === 'anzol') html += renderFamiliaAnzol(fam, filhos);
      else if (tipo === 'molinete') html += renderFamiliaMolinete(fam, filhos);
      else if (tipo === 'carretilha') html += renderFamiliaCarretilha(fam, filhos);
      else if (tipo === 'vara') html += renderFamiliaVara(fam, filhos);
      else if (tipo === 'linha') html += renderFamiliaLinha(fam, filhos);
      else if (tipo === 'empate') html += renderFamiliaEmpate(fam, filhos);
      else if (tipo === 'grade') html += renderFamiliaGrade(fam, filhos);
      else html += renderFamiliaComum(fam, filhos);
      
      filhos.forEach(it => processados.add(it.codigo));
    }
  });

  const soltos = lista.filter(it => !processados.has(it.codigo));
  if (soltos.length > 0) {
    html += `<div class="familia-bloco"><div class="familia-head"><h2>Outros Produtos</h2></div><div class="grade-soltos">${soltos.map(cardSoltos).join('')}</div></div>`;
  }
  cont.innerHTML = html;
}

// ==========================================
// RENDERIZADORES (Design limpo, sem textos soltos)
// ==========================================
function linhaMolinete(it) {
  const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
  const info = analisarMolinete(it);
  
  return `
    <div class="linha-filho">
      <div class="l-info-main">
        <span class="l-cod">${it.codigo}</span>
        <span class="l-nome">${escapeHtml(info.modelo)}</span>
      </div>
      
      <div class="l-preco">R$ ${fmtMoeda(it.preco)}</div>
      
      <div class="l-qtd" onclick="event.stopPropagation()">
        <div class="qtd-ctrl">
          <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
          <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
          <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
        </div>
      </div>
    </div>`;
}

function renderFamiliaMolinete(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  let subdivisoes = fam.subdivisoes || [];
  if (subdivisoes.length === 0) subdivisoes = [{ nome: 'Produtos', itens: fam.itens }];

  const blocosTabelas = subdivisoes.map(sub => {
    const itensDaSub = itens.filter(it => sub.itens.includes(it.codigo) && it.estoque > 0);
    if (itensDaSub.length === 0) return '';
    
    itensDaSub.sort((a, b) => {
      if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
      return a.ordem_excel - b.ordem_excel;
    });

    return `
      <div class="sub-bloco" style="margin-top: 10px;">
        ${subdivisoes.length > 1 ? `<div class="sub-grupo-header">${escapeHtml(sub.nome)}</div>` : ''}
        <div class="lista-filhos" style="margin-top: 6px;">
          ${itensDaSub.map(linhaMolinete).join('')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="familia-bloco">
      <div class="familia-head">
        <h2>${escapeHtml(fam.nome)}</h2> 
        <span class="marca-badge">${escapeHtml(itens[0].marca)}</span>
      </div>
      <div class="molinete-card" id="card-fam-${fam.id}">
        <div class="familia-side">
          <div class="familia-foto-principal" id="foto-pai-${fam.id}">
            ${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}
          </div>
        </div>
        <div class="molinete-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver detalhes do produto</button>
          ${blocosTabelas}
        </div>
      </div>
    </div>`;
}
function linhaCarretilha(it) {
  const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
  const info = analisarMolinete(it);
  
  return `
    <div class="linha-filho">
      <div class="l-nome">${escapeHtml(info.modelo)}</div>
      <div class="l-preco">R$ ${fmtMoeda(it.preco)}</div>
      <div class="l-var-col">
        <span class="tag-var">${escapeHtml(info.variacao || 'Único')}</span>
      </div>
      <div class="l-qtd" onclick="event.stopPropagation()">
        <div class="qtd-ctrl">
          <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
          <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
          <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
        </div>
      </div>
    </div>`;
}

function renderFamiliaCarretilha(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  let subdivisoes = fam.subdivisoes || [];
  if (subdivisoes.length === 0) subdivisoes = [{ nome: 'Todos', itens: fam.itens }];

  const miniaturasHtml = itens.filter(it => it.estoque > 0).map(it => {
    const info = analisarMolinete(it);
    const labelMini = [info.modelo, info.ladoManivela].filter(Boolean).join(' ');
    return `<div class="filho-mini" id="mini-${it.codigo}" onclick="selecionarCarretilha('${fam.id}', '${it.codigo}', '${it.imagem_url}')"><img src="${it.imagem_url}" alt="${escapeHtml(labelMini)}"><div class="mini-info"><span class="mini-nome">${escapeHtml(labelMini)}</span></div></div>`;
  }).join('');

  const blocosTabelas = subdivisoes.map(sub => {
    const itensDaSub = itens.filter(it => sub.itens.includes(it.codigo) && it.estoque > 0);
    if (itensDaSub.length === 0) return '';

    itensDaSub.sort((a, b) => {
      if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
      return a.ordem_excel - b.ordem_excel;
    });

    return `
      <div class="sub-bloco" style="margin-top: 16px;">
        ${subdivisoes.length > 1 ? `<div class="sub-grupo-header">${escapeHtml(sub.nome)}</div>` : ''}
        <div class="lista-filhos" style="margin-top: 8px;">
          <div class="lista-header"><div>Código</div><div>Produto</div><div style="text-align:center">Variação</div><div>Preço</div><div style="text-align:center">Qtd</div></div>
          ${itensDaSub.map(linhaCarretilha).join('')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="familia-bloco">
      <div class="familia-head"><h2>${escapeHtml(fam.nome)}</h2> <span class="marca-badge">${escapeHtml(itens[0].marca)}</span></div>
      <div class="molinete-card" id="card-fam-${fam.id}">
        <div class="familia-side"><div class="familia-foto-principal" id="foto-pai-${fam.id}">${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}</div></div>
        <div class="molinete-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver detalhes do produto</button>
          <div class="topo-miniaturas">${miniaturasHtml}</div>
          ${blocosTabelas}
        </div>
      </div>
    </div>`;
}

function selecionarCarretilha(famId, codigo, url) {
  const card = document.getElementById(`card-fam-${famId}`);
  card.querySelectorAll('.filho-mini').forEach(m => m.classList.remove('ativa'));
  document.getElementById(`mini-${codigo}`).classList.add('ativa');
  document.getElementById(`foto-pai-${famId}`).innerHTML = `<img src="${url}">`;
}

function analisarVara(it) {
  const attrs = it.atributos || {};
  const modeloJson = attrs['Modelo'] || attrs['MODELO'] || it.subgrupo || 'Vara';
  const ignorar = ['QTD', 'CX/CT', 'Modelo', 'MODELO']; 
  const especificacoes = {};
  for (const [chave, valor] of Object.entries(attrs)) {
    if (!ignorar.includes(chave) && valor) especificacoes[chave] = valor;
  }
  return { modeloJson, especificacoes };
}

function renderFamiliaVara(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  let subdivisoes = fam.subdivisoes || [];
  if (subdivisoes.length === 0) subdivisoes = [{ nome: 'Produtos', itens: fam.itens }];

  const colunasSet = new Set();
  itens.forEach(it => { Object.keys(analisarVara(it).especificacoes).forEach(k => colunasSet.add(k)); });
  const colunas = Array.from(colunasSet);

  const blocosTabelas = subdivisoes.map(sub => {
    const itensDaSub = itens.filter(it => sub.itens.includes(it.codigo) && it.estoque > 0);
    if (itensDaSub.length === 0) return '';
    
    itensDaSub.sort((a, b) => {
      if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
      return a.ordem_excel - b.ordem_excel;
    });

    const linhas = itensDaSub.map(it => {
      const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
      const info = analisarVara(it);
      const celulasSpecs = colunas.map(c => {
        const val = info.especificacoes[c] || '-';
        return `<td style="text-align:center; font-size:0.7rem; color:var(--cinza-700);">${escapeHtml(val)}</td>`;
      }).join('');

      return `
        <tr class="linha-tabela-vara">
          <td class="l-cod" style="font-family:monospace; font-weight:800; color:var(--azul-800);">${it.codigo}</td>
          <td style="font-weight:800; color:var(--azul-800); font-size:0.75rem;">${escapeHtml(info.modeloJson)}</td>
          ${celulasSpecs}
          <td style="text-align:center; font-weight:800; color:var(--azul-800);">R$ ${fmtMoeda(it.preco)}</td>
          <td style="text-align:center;" onclick="event.stopPropagation()">
            <div class="qtd-ctrl" style="display:inline-flex;">
              <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
              <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
              <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    return `
      <div class="sub-bloco" style="margin-top: 16px;">
        ${subdivisoes.length > 1 ? `<div class="sub-grupo-header">${escapeHtml(sub.nome)}</div>` : ''}
        <div style="overflow-x: auto; width: 100%; margin-top: 8px; background: white; border-radius: 6px; border: 1px solid var(--cinza-200);">
          <table style="width: 100%; border-collapse: collapse; min-width: max-content;">
            <thead>

function analisarLinha(it) {
  const attrs = it.atributos || {};
  
  // Busca a Bitola (MM)
  let bitola = '-';
  const chaveBitola = Object.keys(attrs).find(k => k.toUpperCase() === 'MM' || k.toUpperCase() === 'BITOLA');
  if (chaveBitola) bitola = attrs[chaveBitola];

  // Busca a Resistência (LBS / KG)
  let resistencia = '';
  const chaveLbs = Object.keys(attrs).find(k => k.toUpperCase().includes('LBS') || k.toUpperCase().includes('KG') || k.toUpperCase().includes('LIBRAS'));
  if (chaveLbs) resistencia = attrs[chaveLbs];

  return { bitola, resistencia };
}

function analisarEmpate(it) {
  const attrs = it.atributos || {};
  const ignorar = ['QTD', 'CX/CT']; 
  const especificacoes = {};
  for (const [chave, valor] of Object.entries(attrs)) {
    if (!ignorar.includes(chave) && valor) especificacoes[chave] = valor;
  }
  return { especificacoes };
}

function analisarIsca(it) {
  const attrs = it.atributos || {};
  const getVal = (arr) => { for (let k of arr) if (attrs[k]) return String(attrs[k]); return ''; };
  
  const modelo = getVal(['Modelo', 'MODELO']);
  const cor = getVal(['Cores', 'COR', 'Cor']);
  const tamanho = getVal(['Tamanho (cm)', 'TAMANHO']);
  const peso = getVal(['Peso (g)', 'PESO']);

  // Monta o texto de especificação (ex: "10 cm • 17.4 g")
  let especificacoes = [];
  if (tamanho) especificacoes.push(tamanho);
  if (peso) especificacoes.push(peso);

  return { 
    modelo, 
    cor, 
    tamanho, 
    peso, 
    especificacoes: especificacoes.join(' • ') 
  };
}

function renderFamiliaIsca(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  const modelosMap = new Map();
  
  itens.filter(it => it.estoque > 0).forEach(it => {
    const info = analisarIsca(it);
    // Agrupa pelo Modelo. Se não tiver modelo, usa o subgrupo.
    const chave = info.modelo || it.subgrupo; 
    
    if (!modelosMap.has(chave)) {
      modelosMap.set(chave, { nome: chave, itens: [] });
    }
    modelosMap.get(chave).itens.push(it);
  });
  
  const modelos = Array.from(modelosMap.values());
  
  modelos.forEach(m => {
    m.itens.sort((a, b) => {
      if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
      return a.ordem_excel - b.ordem_excel;
    });
  });

  const tabsHtml = modelos.map((mod, idx) => `<button class="isca-modelo-btn ${idx===0?'ativo':''}" onclick="trocarModeloIsca('${fam.id}', '${escapeHtml(mod.nome)}')">${escapeHtml(mod.nome)}</button>`).join('');
  
  // Monta o HTML inicial (primeiro modelo da lista)
  const coresHtml = modelos[0] ? modelos[0].itens.map(it => {
    const info = analisarIsca(it); 
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    return `
      <div class="isca-cor-card ${q>0?'tem-qtd':''}" id="mini-${it.codigo}" onclick="selecionarIsca('${fam.id}', '${it.codigo}', '${it.imagem_url}')">

        <img src="${it.imagem_url}">
        <div class="cor-nome">${escapeHtml(info.cor || 'Padrão')}</div>
        ${info.especificacoes ? `<div style="font-size:.65rem; color:var(--cinza-500); font-weight:600; text-align:center; margin-bottom:4px;">${info.especificacoes}</div>` : ''}
        <div class="cor-preco">R$ ${fmtMoeda(it.preco)}</div>
        <div class="isca-qtd-ctrl" onclick="event.stopPropagation()">
          <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
          <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
          <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
        </div>
      </div>`;
  }).join('') : '';

  window.iscasData = window.iscasData || {}; 
  window.iscasData[fam.id] = modelos;
  
  return `
    <div class="familia-bloco">
      <div class="familia-head"><h2>${escapeHtml(fam.nome)}</h2> <span class="marca-badge">${escapeHtml(itens[0].marca)}</span></div>
      <div class="isca-card" id="card-fam-${fam.id}">
        <div class="familia-side">
          <div class="familia-foto-principal" id="foto-pai-${fam.id}">${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}</div>
        </div>
        <div class="isca-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver descrição</button>
          <div class="isca-modelos-tabs">${tabsHtml}</div>
          <div class="isca-titulo-cores">Cores e Tamanhos</div>
          <div class="isca-grade" id="grade-cores-${fam.id}">${coresHtml}</div>
        </div>
      </div>
    </div>`;
}
function trocarModeloIsca(famId, modeloNome) {
  const modelos = window.iscasData[famId]; 
  const modelo = modelos.find(m => m.nome === modeloNome);

  });

  const numerosHtml = itensIniciais.map(it => {
    const info = analisarAnzol(it); 
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    
    // Monta o HTML do card do anzol
    return `
      <div class="anzol-numero-card ${q>0?'tem-qtd':''}" id="mini-${it.codigo}" onclick="selecionarAnzol('${fam.id}', '${it.codigo}', '${it.imagem_url}')">
        <span class="anzol-badge">${q}</span>
        <div class="anzol-numero">${info.numero}</div>
        ${info.qtd ? `<div style="font-size:.65rem; color:var(--cinza-500); font-weight:700; margin-bottom:4px;">${escapeHtml(info.qtd)}</div>` : ''}
        <div class="anzol-preco">R$ ${fmtMoeda(it.preco)}</div>
        <div class="anzol-qtd-ctrl" onclick="event.stopPropagation()">
          <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
          <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
          <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
        </div>
      </div>`;
  }).join('');
  
  window.anzolData = window.anzolData || {}; 
  window.anzolData[fam.id] = { subdivisoes, itens: itensComEstoque };
  
  return `
    <div class="familia-bloco">
      <div class="familia-head"><h2>${escapeHtml(fam.nome)}</h2> <span class="marca-badge">${escapeHtml(itens[0].marca)}</span></div>
      <div class="anzol-card" id="card-fam-${fam.id}">
        <div class="familia-side">
          <div class="familia-foto-principal" id="foto-pai-${fam.id}">${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}</div>
        </div>
        <div class="anzol-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver descrição</button>
          <div class="anzol-tabs">${tabsHtml}</div>
          <div class="isca-titulo-cores">Números</div>
          <div class="anzol-grade" id="grade-numeros-${fam.id}">${numerosHtml}</div>
        </div>
      </div>
    </div>`;
}

function trocarTipoAnzol(famId, subIndex) {
  const data = window.anzolData[famId]; 
  const sub = data.subdivisoes[subIndex];
  const card = document.getElementById(`card-fam-${famId}`);
  card.querySelectorAll('.anzol-tab').forEach(b => b.classList.remove('ativo'));
  // Adiciona a classe ativo no botão clicado
  card.querySelectorAll('.anzol-tab')[subIndex].classList.add('ativo');
  
  const itensFiltrados = data.itens.filter(it => sub.itens.includes(it.codigo) && it.estoque > 0);
  
  itensFiltrados.sort((a, b) => {
    if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
    return a.ordem_excel - b.ordem_excel;
  });

  document.getElementById(`grade-numeros-${famId}`).innerHTML = itensFiltrados
    .map(it => {
      const info = analisarAnzol(it); 
      const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
      return `
        <div class="anzol-numero-card ${q>0?'tem-qtd':''}" id="mini-${it.codigo}">
          <span class="anzol-badge">${q}</span>
          <div class="anzol-numero">${info.numero}</div>
          ${info.qtd ? `<div style="font-size:.65rem; color:var(--cinza-500); font-weight:700; margin-bottom:4px;">${escapeHtml(info.qtd)}</div>` : ''}
          <div class="anzol-preco">R$ ${fmtMoeda(it.preco)}</div>
          <div class="anzol-qtd-ctrl" onclick="event.stopPropagation()">
            <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
            <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
            <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
          </div>
        </div>`;
    }).join('');
} 
function selecionarAnzol(famId, codigo, url) {
  const card = document.getElementById(`card-fam-${famId}`);
  card.querySelectorAll('.anzol-numero-card').forEach(m => m.classList.remove('ativa'));
  document.getElementById(`mini-${codigo}`).classList.add('ativa');
  document.getElementById(`foto-pai-${famId}`).innerHTML = `<img src="${url}">`;
}

function renderFamiliaComum(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  const itensComEstoque = itens.filter(it => it.estoque > 0);
  if (itensComEstoque.length === 0) return '';

  itensComEstoque.sort((a, b) => {
    if (a.ordem_customizada_pos !== 999999 || b.ordem_customizada_pos !== 999999) return a.ordem_customizada_pos - b.ordem_customizada_pos;
    return a.ordem_excel - b.ordem_excel;
  });
  
  const linhasHtml = itensComEstoque.map(it => {
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    return `
      <div class="linha-filho">
        <div class="l-cod">${it.codigo}</div>
        <div class="l-nome">${escapeHtml(it.subgrupo)}</div>
        <div class="l-var-col"></div>
        <div class="l-preco">R$ ${fmtMoeda(it.preco)}</div>
        <div class="l-qtd" onclick="event.stopPropagation()">
          <div class="qtd-ctrl"><button onclick="mudarQtd('${it.codigo}', -1)">−</button><input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)"><button onclick="mudarQtd('${it.codigo}', 1)">+</button></div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="familia-bloco">
      <div class="familia-head"><h2>${escapeHtml(fam.nome)}</h2> <span class="marca-badge">${escapeHtml(itens[0].marca)}</span></div>
      <div class="familia-card" id="card-fam-${fam.id}">
        <div class="familia-side"><div class="familia-foto-principal">${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}</div></div>
        <div class="familia-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver detalhes</button>
          <div class="lista-filhos"><div class="lista-header"><div>Código</div><div>Produto</div><div>Variação</div><div>Preço</div><div>Qtd</div></div>${linhasHtml}</div>
        </div>
      </div>
    </div>`;
}

function cardSoltos(it) {
  return `<div class="card-solto"><div class="img">${it.imagem_url ? `<img src="${it.imagem_url}">` : '🖼️'}</div><div class="nome">${escapeHtml(it.subgrupo)}</div><div class="preco">R$ ${fmtMoeda(it.preco)}</div></div>`;
}

function abrirModalDescricao(titulo, texto) {
  if (!texto) texto = 'Este produto não possui descrição detalhada.';
  document.getElementById('modalTitulo').textContent = titulo || 'Detalhes do Produto';
  document.getElementById('modalBody').innerHTML = `<p>${escapeHtml(texto)}</p>`;
  document.getElementById('modalBg').classList.add('on');
}
function abrirModalPorBotao(btn) {
  abrirModalDescricao(btn.getAttribute('data-titulo'), btn.getAttribute('data-desc'));
}
function fecharModal(ev, force) {
  if (!force && ev && ev.target && ev.target.id !== 'modalBg') return;
  document.getElementById('modalBg').classList.remove('on');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharModal(null, true); fecharCarrinho(); } });

// ==========================================
// LÓGICA DO CARRINHO FLUTUANTE
// ==========================================
function buscarItem(codigo) { return todosItens.find(i => i.codigo === codigo); }
function mudarQtd(cod, delta) { const a = carrinho[cod] ? carrinho[cod].qtd : 0; setQtd(cod, a + delta); }
function setQtd(cod, valor) {
  const q = parseInt(valor) || 0; const item = buscarItem(cod);
  if (q <= 0) delete carrinho[cod];
  else carrinho[cod] = { qtd: q, precoBase: item.precoBase, desc: item.subgrupo, img: item.imagem_url };
  
  document.querySelectorAll(`input[onchange*="'${cod}'"]`).forEach(inp => inp.value = q);
  
  const card = document.getElementById(`mini-${cod}`);
  if (card) {
    const badge = card.querySelector('.isca-badge') || card.querySelector('.anzol-badge');
    if (q > 0) { card.classList.add('tem-qtd'); if (badge) badge.textContent = q; }
    else card.classList.remove('tem-qtd');
  }
  atualizarCarrinho();
}

function atualizarCarrinho() {
  const itens = Object.keys(carrinho); 
  let total = 0, qtdTotal = 0;
  
  const html = itens.map(cod => {
    const i = carrinho[cod];
    const precoFinalUnitario = calcularPrecoFinal(i.precoBase);
    const sub = precoFinalUnitario * i.qtd; 
    total += sub; qtdTotal += i.qtd;
    
    return `
      <div class="item-carrinho">
        ${i.img ? `<img src="${i.img}">` : '<div style="width:30px;text-align:center;font-size:20px;">🖼️</div>'}
        <div class="dados">
          <span class="titulo">${escapeHtml(i.desc)}</span>
          <span class="preco">${i.qtd}x R$ ${fmtMoeda(sub)}</span>
        </div>
        <div class="acoes">
          <button onclick="setQtd('${cod}', 0)">✕</button>
        </div>
      </div>`;
  }).join('');

  const btnFab = document.getElementById('btnCarrinho');
  const badgeFab = document.getElementById('topoQtd');
  
  // Se tiver item, mostra o botão flutuante
  if (qtdTotal > 0) {
    btnFab.style.display = 'flex';
    badgeFab.textContent = qtdTotal;
  } else {
    btnFab.style.display = 'none';
    fecharCarrinho(); // Se zerar, esconde o painel
  }

  document.getElementById('carrinhoTotal').textContent = `R$ ${fmtMoeda(total)}`;
  document.getElementById('listaCarrinho').innerHTML = html || '<div style="text-align:center;color:#94a3b8;padding:20px;">Vazio</div>';
}

function toggleCarrinho() {
  const painel = document.getElementById('painelCarrinho');
  painel.classList.toggle('on');
}

function fecharCarrinho() {
  const painel = document.getElementById('painelCarrinho');
  painel.classList.remove('on');
}

let deb;
document.getElementById('busca').addEventListener('input', e => {
  clearTimeout(deb); deb = setTimeout(() => { buscaAtual = e.target.value; renderizar(); }, 200);
});

document.getElementById('inputCnpj').addEventListener('input', function(e) {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length > 14) v = v.slice(0, 14);
  v = v.replace(/^(\d{2})(\d)/, '$1.$2');
  v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
  v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
  v = v.replace(/(\d{4})(\d)/, '$1-$2');
  e.target.value = v;
});

document.getElementById('inputCnpj').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fazerLogin();
});
</script>
