<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tabela de Preços B2B</title>
<style>
  /* BADGE DE LANÇAMENTO FLUTUANTE NA FOTO PRINCIPAL */
  .tarja-lancamento-foto {
    position: absolute;
    top: 6px;
    left: 6px;
    background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    color: #ffffff;
    font-size: 0.65rem;
    font-weight: 900;
    padding: 3px 8px;
    border-radius: 6px;
    z-index: 10;
    border: 1px solid #60a5fa;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --azul-900:#001f3f; --azul-800:#003366; --azul-700:#004080;
    --azul-500:#2563eb; --azul-100:#dbeafe; --azul-50:#eff6ff;
    --branco:#ffffff; --cinza-50:#f8fafc; --cinza-100:#f1f5f9;
    --cinza-200:#e2e8f0; --cinza-300:#cbd5e1; --cinza-400:#94a3b8;
    --cinza-500:#64748b; --cinza-700:#334155; --texto:#1a2a3a;
    --verde:#10b981; --verde-hover:#059669;
    --vermelho:#ef4444; --vermelho-suave:#fee2e2;
  }
  body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:var(--cinza-50); color:var(--texto); -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom: 90px; }
  button { font-family:inherit; cursor:pointer; }

  /* LOGIN */
  #telaLogin { position:fixed; inset:0; z-index:9999; background:linear-gradient(135deg, #001f3f 0%, #003366 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { background:white; border-radius:16px; padding:30px 20px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.4); text-align:center; }
  .login-box h1 { color:var(--azul-800); font-size:1.4rem; font-weight:800; margin-bottom:8px; }
  .login-box p { color:var(--cinza-500); font-size:.85rem; margin-bottom:20px; }
  .login-box input { width:100%; padding:14px 16px; border:2px solid var(--cinza-200); border-radius:10px; font-size:1rem; text-align:center; font-weight:700; letter-spacing:1px; margin-bottom:16px; }
  .login-box input:focus { outline:none; border-color:var(--azul-500); }
  .login-box button { width:100%; padding:14px; background:var(--azul-800); color:white; border:none; border-radius:10px; font-size:1rem; font-weight:800; transition:.2s; }
  .login-box button:hover { background:var(--azul-700); }
  .login-erro { color:var(--vermelho); font-size:.85rem; font-weight:700; margin-bottom:12px; display:none; }

  /* TOPO LIMPO */
  .topo { background:linear-gradient(135deg, #001f3f 0%, #003366 100%); color:white; position:sticky; top:0; z-index:100; box-shadow:0 4px 24px rgba(0,51,102,.25); }
  .topo-inner { max-width:1600px; margin:0 auto; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  
  .info-cliente { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:20px; font-size:.75rem; font-weight:700; white-space:nowrap; }
  .info-cliente span.uf { background:var(--verde); color:white; padding:2px 6px; border-radius:4px; font-size:0.65rem; }
  .btn-topo-acao { background:#2563eb; color:white; border:none; padding:4px 8px; border-radius:10px; font-weight:800; font-size:0.7rem; cursor:pointer; display:inline-flex; align-items:center; gap:3px; }
  .btn-topo-sair { background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:10px; font-weight:800; font-size:0.7rem; cursor:pointer; }

  .busca-wrap { flex:1; }
  .busca-wrap input { width:100%; padding:9px 14px; border:none; border-radius:10px; font-family:inherit; font-size:.85rem; background:rgba(255,255,255,.18); color:white; }
  .busca-wrap input::placeholder { color:rgba(255,255,255,.7); }
  .busca-wrap input:focus { outline:none; background:rgba(255,255,255,.28); }

  /* BOTÕES DE GRUPO PREENCHIDOS */
  .chips-wrap { background:white; border-bottom:1px solid var(--cinza-200); position:sticky; top:49px; z-index:90; padding:8px 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chips { max-width:1600px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap: nowrap; }
  
  .chip { 
    width: 48px; height: 48px; 
    border-radius: 12px; background: var(--cinza-100); 
    border: 2px solid var(--cinza-200); cursor: pointer; 
    transition: .15s; display: flex; align-items: center; justify-content: center; 
    padding: 3px; flex-shrink: 0; overflow: hidden;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--azul-500); }
  .chip.ativo { background: var(--azul-800); border-color: var(--azul-800); box-shadow: 0 4px 12px rgba(0,31,63,0.3); }
  
  .chip.chip-oferta { background: #fee2e2; border-color: #fca5a5; font-size: 1.4rem; color: #ef4444; }
  .chip.chip-oferta.ativo { background: #ef4444; border-color: #dc2626; color: white; }
  
  .chip-img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

  /* LOGOMARCAS */
  .marca-logo-img { height: 26px; max-width: 110px; object-fit: contain; vertical-align: middle; }
  
  /* CONTEÚDO */
  .conteudo { padding:0; max-width:1600px; margin:0 auto; }
  .loading { text-align:center; padding:60px 20px; color:var(--cinza-400); }
  
  .familia-bloco { margin: 12px; }
  .familia-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:6px; margin-bottom:8px; border-bottom:2px solid var(--azul-100); flex-wrap:wrap; }
  .familia-head h2 { color:var(--azul-800); font-size:1.05rem; font-weight:800; }
  .familia-head .marca-badge { background:var(--azul-50); color:var(--azul-800); padding:3px 8px; border-radius:12px; font-size:.65rem; font-weight:800; text-transform:uppercase; }

  .sub-grupo-header { background: var(--azul-50); color: var(--azul-800); padding: 6px 10px; border-radius: 6px; border-left: 4px solid var(--azul-500); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display:inline-block; }
  
  /* CARDS E GRADES */
  .familia-card, .isca-card, .anzol-card, .molinete-card { 
    display:grid; grid-template-columns: 1fr; gap:12px; background:white; 
    border:1px solid var(--cinza-200); border-radius:12px; padding:12px; 
    box-shadow:0 2px 8px rgba(0,0,0,.03); position:relative; 
  }
  @media(min-width: 768px) {
    .familia-card, .isca-card, .anzol-card, .molinete-card { grid-template-columns: 180px 1fr; gap:16px; padding:16px; }
  }

  .familia-side { display:flex; flex-direction:column; gap:8px; position:relative; }
  .familia-foto-principal { background:var(--cinza-50); border:1px solid var(--cinza-100); border-radius:10px; padding:8px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; cursor:pointer; max-width: 220px; margin: 0 auto; width:100%; position:relative; }
  .familia-foto-principal img { max-width:100%; max-height:100%; object-fit:contain; }
  
  .btn-detalhes { background:var(--cinza-50); border:1px solid var(--cinza-200); color:var(--azul-800); border-radius:6px; font-size:.65rem; font-weight:800; text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:6px 10px; margin-bottom:8px; align-self:flex-start; }

  /* BADGES DE OFERTA */
  .badge-oferta-banner {
    position: absolute; top: -8px; left: -8px;
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    color: white; font-weight: 900; font-size: 0.65rem; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px; z-index: 5; border: 1px solid white;
  }
  .tarja-oferta-item {
    display: inline-flex; align-items: center; gap: 2px;
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    color: white; font-size: 0.6rem; font-weight: 900;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; margin-left: 4px;
  }
  
  .preco-box-oferta { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .preco-de { text-decoration: line-through; color: #94a3b8; font-size: 0.7rem; font-weight: 700; line-height: 1; }
  .preco-por { color: #ef4444; font-size: 0.9rem; font-weight: 900; line-height: 1; }

  /* CONTAINER EMBUTIDO DO ENCARTE DE OFERTAS */
  .iframe-ofertas { width: 100%; height: calc(100vh - 110px); border: none; display: block; }

  /* MINIATURAS E GRADES */
  .topo-miniaturas { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--cinza-100); }
  .filho-mini { min-width: 65px; width: 65px; background:white; border:2px solid var(--cinza-200); border-radius:6px; padding:3px; cursor:pointer; text-align:center; }
  .filho-mini img { width:100%; aspect-ratio:1; object-fit:contain; }
  .mini-nome { font-size:.5rem; font-weight:800; color:var(--azul-800); text-transform:uppercase; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filho-mini.ativa { border-color:var(--azul-800); background:var(--azul-50); }

  .isca-modelos-tabs, .anzol-tabs, .molinete-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid var(--cinza-200); }
  .isca-modelo-btn, .anzol-tab, .molinete-tab { padding:5px 10px; border-radius:6px; border:1px solid var(--cinza-200); background:var(--cinza-50); color:var(--azul-800); font-size:.75rem; font-weight:800; cursor:pointer; white-space:nowrap; }
  .isca-modelo-btn.ativo, .anzol-tab.ativo, .molinete-tab.ativo { background:var(--azul-800); color:white; border-color:var(--azul-800); }
  .isca-titulo-cores { font-size:.7rem; font-weight:800; color:var(--cinza-500); text-transform:uppercase; margin-bottom:8px; }
  
  .isca-grade, .anzol-grade, .molinete-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; }
  .isca-cor-card, .anzol-numero-card, .molinete-numero-card { background:white; border:1px solid var(--cinza-200); border-radius:8px; padding:6px; display:flex; flex-direction:column; align-items:center; position:relative; }
  .isca-cor-card.ativa, .anzol-numero-card.ativa, .molinete-numero-card.ativa { border-color:var(--azul-800); }
  .isca-cor-card img { width:100%; aspect-ratio:1; object-fit:contain; margin-bottom:2px; }
  .cor-nome, .anzol-numero, .molinete-numero { font-size:.75rem; font-weight:800; color:var(--azul-800); text-align:center; word-break:break-word; }
  .cor-preco, .anzol-preco, .molinete-preco { font-size:.75rem; font-weight:800; color:var(--verde); }

  .isca-badge, .anzol-badge, .molinete-badge { position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; background:var(--verde); color:white; border-radius:9px; font-size:10px; font-weight:900; display:none; align-items:center; justify-content:center; border:2px solid white; z-index:3; }
  .isca-cor-card.tem-qtd .isca-badge, .anzol-numero-card.tem-qtd .anzol-badge, .molinete-numero-card.tem-qtd .molinete-badge { display:flex; }
  .isca-cor-card.tem-qtd, .anzol-numero-card.tem-qtd, .molinete-numero-card.tem-qtd { border-color:var(--verde); background:#f0fdf4; }
  
  .isca-qtd-ctrl, .anzol-qtd-ctrl, .molinete-qtd-ctrl { display:flex; align-items:center; gap:2px; margin-top:4px; width:100%; justify-content:center; }
  .isca-qtd-ctrl button, .anzol-qtd-ctrl button, .molinete-qtd-ctrl button { width:22px; height:22px; border-radius:4px; border:1px solid var(--cinza-300); background:white; font-weight:800; color:var(--azul-800); }
  .isca-qtd-ctrl input, .anzol-qtd-ctrl input, .molinete-qtd-ctrl input { width:26px; height:22px; border:1px solid var(--cinza-300); border-radius:4px; text-align:center; font-weight:800; font-size:0.75rem; color:var(--azul-800); }

  /* LISTAS DE ITENS DA TABELA */
  .linha-filho-container { display:flex; flex-direction:column; background:white; border:1px solid var(--cinza-200); border-radius:8px; overflow:hidden; }
  .linha-filho { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 8px; flex-wrap:wrap; }
  .l-info-main { display:flex; align-items:center; gap:4px; flex:1; min-width:140px; }
  .l-cod { font-family:monospace; font-weight:800; color:var(--cinza-500); font-size:.7rem; background:var(--cinza-100); padding:2px 4px; border-radius:4px; white-space:nowrap; }
  .l-nome { font-size:.75rem; font-weight:800; color:var(--azul-800); line-height:1.2; word-break:break-word; }
  .tag-lado { background: var(--azul-100); color: var(--azul-800); font-size: .6rem; font-weight: 800; padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
  .l-direita-wrap { display:flex; align-items:center; gap:6px; margin-left:auto; }
  .btn-toggle-var { background:var(--azul-50); border:1px solid var(--azul-200); border-radius:4px; padding:2px 5px; font-size:.75rem; }
  .l-preco { font-size:.8rem; font-weight:900; color:var(--verde); white-space:nowrap; }
  .painel-variacao-oculta { display:none; background:var(--cinza-50); border-top:1px dashed var(--cinza-200); padding:6px 8px; font-size:.7rem; color:var(--cinza-700); }
  .painel-variacao-oculta.ativo { display:block; }

  .qtd-ctrl { display:inline-flex; align-items:center; border:1px solid var(--cinza-300); border-radius:6px; background:white; overflow:hidden; }
  .qtd-ctrl button { width:24px; height:24px; border:none; background:var(--cinza-50); font-weight:800; color:var(--azul-800); font-size:.85rem; }
  .qtd-ctrl input { width:26px; height:24px; text-align:center; border:none; font-weight:800; color:var(--azul-800); font-size:.75rem; }

  .grade-soltos { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
  .card-solto { background:white; border:1px solid var(--cinza-200); border-radius:8px; padding:8px; text-align:center; position:relative; }
  .card-solto .img { width:100%; aspect-ratio:1; background:var(--cinza-50); display:flex; align-items:center; justify-content:center; border-radius:6px; margin-bottom:6px; overflow:hidden; }
  .card-solto .img img { width:100%; height:100%; object-fit:contain; }
  .card-solto .nome { font-size:.7rem; font-weight:700; color:var(--azul-800); margin-bottom:4px; line-height:1.2; word-break:break-word; }
  .card-solto .preco { font-size:.8rem; font-weight:800; color:var(--verde); }

  /* CARRINHO FLUTUANTE */
  .fab-carrinho { position:fixed; bottom:20px; right:20px; background:var(--azul-800); color:white; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 4px 16px rgba(0,51,102,0.4); cursor:pointer; z-index:150; }
  .fab-qtd { position:absolute; top:-4px; right:-4px; background:var(--vermelho); color:white; font-size:11px; font-weight:900; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; border:2px solid white; }
  .painel-carrinho { position:fixed; bottom:85px; right:16px; left:16px; max-width:400px; margin:0 auto; background:white; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.3); z-index:200; display:none; flex-direction:column; overflow:hidden; border:1px solid var(--cinza-200); }
  .painel-carrinho.on { display:flex; }
  .painel-head { background:var(--azul-800); color:white; padding:12px 16px; font-weight:800; font-size:.85rem; display:flex; justify-content:space-between; align-items:center; }
  .painel-lista { padding:10px; max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .item-carrinho { display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; padding:6px; background:var(--cinza-50); border-radius:6px; font-size:.75rem; }
  .item-carrinho img { width:30px; height:30px; object-fit:contain; }
  .painel-foot { padding:12px 16px; border-top:1px solid var(--cinza-200); background:white; }
  .total-linha { display:flex; justify-content:space-between; font-weight:800; font-size:1rem; margin-bottom:10px; color:var(--azul-800); }
  .btn-finalizar { width:100%; background:var(--verde); color:white; border:none; padding:10px; border-radius:8px; font-weight:800; font-size:.95rem; cursor:pointer; }

  /* MODAIS */
  .modal-bg { position:fixed; inset:0; z-index:500; background:rgba(0,15,30,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:.25s; }
  .modal-bg.on { opacity:1; pointer-events:auto; }
  .modal { background:white; border-radius:12px; max-width:550px; width:100%; max-height:85vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 80px rgba(0,0,0,.5); }
  .modal-head { background:var(--azul-800); color:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  .modal-body { padding:16px; overflow-y:auto; }

  .zoom-modal-bg { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  .zoom-modal-bg.on { opacity: 1; pointer-events: auto; }
  .zoom-modal-content { position: relative; max-width: 95vw; max-height: 90vh; display: flex; align-items: center; justify-content: center; }
  .zoom-modal-content img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 8px; background: white; padding: 6px; }
  .zoom-x { position: absolute; top: -12px; right: -12px; background: var(--vermelho); color: white; border: 2px solid white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px; font-weight: bold; }
</style>
</head>
<body>

<!-- BOTÃO FLUTUANTE DISCRETO DO WHATSAPP -->
<a id="btnWhatsVendedor" href="#" target="_blank" style="display:none; position:fixed; bottom:20px; left:20px; background:#25D366; color:white; padding:10px 16px; border-radius:30px; font-weight:800; font-size:0.8rem; text-decoration:none; box-shadow:0 4px 16px rgba(37,211,102,0.4); z-index:150; align-items:center; gap:8px;">
  <span style="font-size:1.1rem;">💬</span> Falar com <span id="nomeVendedorWhats">Vendedor</span>
</a>
<div id="telaLogin">
  <div class="login-box">
    <h1>Catálogo B2B</h1>
    <p>Digite o seu CNPJ para acessar a tabela de preços.</p>
    <div class="login-erro" id="loginErro">CNPJ não encontrado ou inativo.</div>
    <input type="text" id="inputCnpj" placeholder="00.000.000/0000-00" autocomplete="off">
    <button onclick="fazerLogin()">Acessar Catálogo</button>
  </div>
</div>

<header class="topo">
  <div class="topo-inner">
    <div class="info-cliente" id="infoCliente" style="display:none;">
      👤 <span id="nomeCliente">—</span>
      <span class="uf" id="badgeUf">—</span>
      <button class="btn-topo-acao" onclick="abrirMeusPedidos()">📋 Pedidos</button>
      <button class="btn-topo-sair" onclick="sairCliente()">Sair</button>
    </div>

    <div class="busca-wrap">
      <input type="search" id="busca" placeholder="🔍 Buscar produto por código, nome ou palavra-chave..." autocomplete="off">
    </div>
  </div>
</header>

<!-- AVISO DE VALIDADE DA TABELA -->
<div id="barraAvisoTabela" style="display:none; text-align:center; padding:8px 12px; font-weight:800; font-size:0.8rem; border-bottom:1px solid transparent;"></div>

<!-- CABAÇALHO DE GRUPOS -->
<div class="chips-wrap"><div class="chips" id="chips"></div></div>

<!-- BARRA SECUNDÁRIA DE MARCAS -->
<div id="barramarcasWrap" style="display:none; background:#f1f5f9; border-bottom:1px solid #e2e8f0; padding:6px 12px; position:sticky; top:105px; z-index:89; overflow-x:auto;">
  <div id="barramarcas" style="max-width:1600px; margin:0 auto; display:flex; gap:8px; align-items:center;"></div>
</div>

<main class="conteudo" id="conteudo">
  <div class="loading">Carregando catálogo…</div>
</main>

<div class="fab-carrinho" id="btnCarrinho" onclick="toggleCarrinho()" style="display:none;">
  🛒
  <div class="fab-qtd" id="topoQtd">0</div>
</div>

<div class="painel-carrinho" id="painelCarrinho">
  <div class="painel-head">
    <span>Seu Pedido</span>
    <button onclick="toggleCarrinho()" style="background:none; border:none; color:white; font-weight:bold;">✕</button>
  </div>
  <div class="painel-lista" id="listaCarrinho"></div>
  <div class="painel-foot">
    <div class="total-linha">
      <span>Total:</span>
      <span id="carrinhoTotal">R$ 0,00</span>
    </div>
    <button class="btn-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
  </div>
  <div class="painel-foot">
  <div class="total-linha">
    <span>Total:</span>
    <span id="carrinhoTotal">R$ 0,00</span>
  </div>

function calcularQtdComLote(codigoProduto, quantidadeInserida) {
  const qtd = parseInt(quantidadeInserida, 10) || 0;
  if (qtd <= 0) return 0;

  // Se o produto estiver na lista dos 5 modelos
  if (PRODUTOS_LOTE_10.includes(String(codigoProduto))) {
    // Se a pessoa digitou 1 até 10, vira 10. Se digitou 12, arredonda para 20 (próximo múltiplo)
    const resto = qtd % 10;
    if (resto === 0) return qtd;
    return Math.ceil(qtd / 10) * 10;
  }

  return qtd; // Produtos normais seguem com a quantidade digitada
}

    const barra = document.getElementById('barraAvisoTabela');

    hoje.setHours(0, 0, 0, 0);

    const [anoFim, mesFim, diaFim] = j.regras.tabela_data_fim.split('-');
    const dataFimTabela = new Date(anoFim, mesFim - 1, diaFim);

    if (hoje > dataFimTabela) {
      barra.style.background = '#fee2e2';
      barra.style.color = '#991b1b';
      barra.style.borderColor = '#fca5a5';
      barra.innerHTML = `⚠️ <strong>TABELA VENCIDA!</strong> Esta tabela expirou em <strong>${fmtDataBr(j.regras.tabela_data_fim)}</strong>. Os preços podem ter variação. Peça tabela nova ao seu vendedor.`;

      barra.innerHTML = `📅 <strong>TABELA DE PREÇOS VÁLIDA ATÉ ${fmtDataBr(j.regras.tabela_data_fim)}</strong>`;
      barra.style.display = 'block';
    }
  } catch (e) {
    console.error('Erro ao verificar validade da tabela:', e);
  }
}

// DELETAR RASCUNHO
async function deletarRascunho(idPedido) {
  if (!confirm(`Tem certeza que deseja excluir o rascunho #${idPedido}?`)) return;

  try {
    const r = await fetch(`/api/pedidos/${idPedido}`, { method: 'DELETE' });
    const j = await r.json();

    if (j.ok) {
      if (pedidoEmEdicaoId === idPedido) {
        carrinho = {};
        pedidoEmEdicaoId = null;
        atualizarCarrinho();
      }
      alert('🗑️ Rascunho excluído!');
      abrirMeusPedidos(); // Recarrega o modal
    } else {
      alert('❌ Erro ao excluir: ' + j.erro);
    }
  } catch (e) {
    alert('❌ Erro de conexão ao excluir rascunho.');
  }
}

// CARREGAR UM PEDIDO DE VOLTA NO CARRINHO PARA EDIÇÃO
function carregarPedidoParaEdicao(idPedido, jsonItensStr) {
  try {
    const itens = JSON.parse(jsonItensStr);
    carrinho = {};
    pedidoEmEdicaoId = idPedido;

    itens.forEach(it => {
      const prodEncontrado = todosItens.find(i => i.codigo === String(it.codigo_produto));
      carrinho[it.codigo_produto] = {
        qtd: it.quantidade,
        precoBase: it.preco_unitario || (prodEncontrado ? prodEncontrado.precoBase : 0),
        desc: it.descricao,
        img: prodEncontrado ? prodEncontrado.imagem_url : ''
      };
    });

    atualizarCarrinho();
    fecharModal(null, true);
    toggleCarrinho(); // Abre o carrinho na tela
    alert(`Pedido #${idPedido} carregado no carrinho! Você já pode alterar as quantidades.`);
  } catch (e) {
    alert('Erro ao carregar o pedido para edição.');
  }
}

// SALVAR APENAS COMO RASCUNHO (GRAVAR NO BANCO SEM FINALIZAR)
async function salvarRascunho() {
  const itens = Object.keys(carrinho).map(cod => {
    const item = carrinho[cod];
    const calc = calcularValoresProduto(item.precoBase, cod);
    return { codigo: cod, desc: item.desc, qtd: item.qtd, precoBase: item.precoBase, precoFinal: calc.precoFinal };
  });

  if (itens.length === 0) { alert('Seu carrinho está vazio.'); return; }
  const total = itens.reduce((acc, it) => acc + (it.precoFinal * it.qtd), 0);

  try {
    const r = await fetch('/api/pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: pedidoEmEdicaoId,
        cnpj_cliente: clienteLogado.cnpj,
        codigo_representante: clienteLogado.representante,
        status: 'RASCUNHO',
        total,
        itens
      })
    });
    const j = await r.json();

    if (j.ok) {
      pedidoEmEdicaoId = j.id; // Guarda o ID gerado
      alert('💾 Rascunho salvo no banco com sucesso!');
    } else {
      alert('❌ Erro ao salvar rascunho: ' + j.erro);
    }
  } catch (e) {
    alert('❌ Erro de conexão ao salvar rascunho.');
  }
}

function calcularValoresProduto(precoBase, codItem) {
  const precoBaseComAcrescimo = precoBase + ((precoBase * porcentagemAcrescimo) / 100);
  
  if (mapaOfertas[codItem]) {
    const pctDesconto = mapaOfertas[codItem];
    const precoFinal = precoBaseComAcrescimo - (precoBaseComAcrescimo * pctDesconto / 100);
    return { temOferta: true, pctDesconto: pctDesconto, precoOriginal: precoBaseComAcrescimo, precoFinal: precoFinal };
  }

  return { temOferta: false, pctDesconto: 0, precoOriginal: precoBaseComAcrescimo, precoFinal: precoBaseComAcrescimo };
}

function normalizarItem(it) {
  return {
    codigo: String(it.codigo ?? ''),
    subgrupo: (it.subgrupo_scraping || it.descricao || '').trim(), 
    descricao_longa: it.descricao || it.descricao_longa || '', 
    imagem_url: it.imagem_url || '',
    precoBase: Number(it.preco_venda) || 0,
    get calculoPreco() { return calcularValoresProduto(this.precoBase, this.codigo); },
    get preco() { return this.calculoPreco.precoFinal; },
    grupo: (it.grupo_scraping || it.grupo || '').trim(),
    marca: (it.marca || '').trim(),
    atributos: parseAtributos(it.atributos_json),
    estoque: Number(it.estoque) || 0,
    ordem_excel: Number(it.ordem_excel) || 999999,
    ordem_customizada_pos: 999999,
    is_lancamento: Boolean(it.is_lancamento)
  };
}

function formatarNomeCard(item, nomeFamilia) {
  let sub = (item.subgrupo || item.descricao || '').trim();
  const famUpper = (nomeFamilia || '').toUpperCase().trim();
  const attrs = item.atributos || {};
  const descCompleta = (item.descricao_longa || item.descricao || '').trim();

  // Atributos lidos do JSON
  const modeloAttr = attrs['Modelo'] || attrs['MODELO'] || '';
  const tamanhoAttr = attrs['Tamanho'] || attrs['TAMANHO'] || '';

  // 1. DIMENSÕES PARA CAIXAS ALVO (Multicase, Isca MS, Tackle Box, Double Layer, Water Resistant)
  const ehCaixaAlvo = famUpper.includes('MULTICASE') || 
                      famUpper.includes('ISCA MS') || 
                      famUpper.includes('TACKLE BOX') || 
                      famUpper.includes('WATER RESISTANT') ||
                      famUpper.includes('SHALLOW');

  if (ehCaixaAlvo) {
    let dimensaoJson = attrs['Dimensões(cm)'] || attrs['Dimensões'] || attrs['Dimensoes'] || attrs['Dimensão'] || attrs['Dimensao'] || '';
    if (!dimensaoJson) {
      const matchMedida = descCompleta.match(/(\d+[\.,]?\d*\s*[xX]\s*\d+[\.,]?\d*(?:\s*[xX]\s*\d+[\.,]?\d*)?\s*(?:cm|mm)?)/i);
      if (matchMedida) dimensaoJson = matchMedida[1].trim();
    }

    if (dimensaoJson) {
      if (modeloAttr) {
        const modeloLimpo = modeloAttr.split('-')[0].trim();
        return `${modeloLimpo} • ${dimensaoJson}`;
      }
      return dimensaoJson;
    }
  }

  // 2. CARRETEL (Ex: SURF HSC 8000)
  if (famUpper.includes('CARRETEL')) {
    if (modeloAttr) return modeloAttr.trim();
  }

  // 3. MOCHILA E BOLSA FRONTIER / PESCADOR
  if (famUpper.includes('MOCHILA') || famUpper.includes('BOLSA')) {
    if (modeloAttr) {
      let txt = modeloAttr.trim();
      if (sub.toUpperCase().includes('C/CAIXA') || sub.toUpperCase().includes('COM CAIXA')) {
        if (!txt.toUpperCase().includes('C/CAIXA')) txt += ' C/CAIXA';
      } else if (sub.toUpperCase().includes('S/CAIXA') || sub.toUpperCase().includes('SEM CAIXA')) {
        if (!txt.toUpperCase().includes('S/CAIXA')) txt += ' S/CAIXA';
      }
      return txt;
    }
  }

  // 4. CORDÃO DE ÓCULOS (Ex: SSB PRETO)
  if (famUpper.includes('CORDÃO') || famUpper.includes('CORDAO') || famUpper.includes('ÓCULOS') || famUpper.includes('OCULOS')) {
    if (modeloAttr && modeloAttr.toUpperCase() !== 'ÚNICO' && modeloAttr.toUpperCase() !== 'UNICO') {
      return modeloAttr.trim();
    }
    // Se o subgrupo tiver variação de cor/código no final
    const matchCor = sub.match(/(SSB\s+[A-Z]+|[A-Z0-9-]+\s*(?:PRETO|AZUL|VERMELHO|VERDE|AMARELO))/i);
    if (matchCor) return matchCor[1].toUpperCase();
  }

  // 5. FACA FILLET / FACAS (Ex: FILLET MFK6T ou 6" / 15cm)
  if (famUpper.includes('FACA') || famUpper.includes('FILLET') || famUpper.includes('KNIFE')) {
    if (modeloAttr) return modeloAttr.trim();
    if (tamanhoAttr) return tamanhoAttr.trim();
    
    // Tenta extrair código de modelo ou tamanho (ex: MFK6T, 6", 15cm)
    const matchFaca = descCompleta.match(/\b([A-Z0-9-]{3,10}|\d+["']|\d+\s*cm)\b/i);
    if (matchFaca && !matchFaca[1].toUpperCase().includes('FACA')) {
      return matchFaca[1].toUpperCase();
    }
  }

  // 6. TRATAMENTO PADRÃO DE SEGURANÇA PARA NOMES GENÉRICOS (evita "KNIFE", "CAIXA", "C", "S")
  if (['KNIFE', 'CAIXA', 'FACA', 'C', 'S', 'BOLSAS', 'CORDÃO', 'CORDAO'].includes(sub.toUpperCase())) {
    return (modeloAttr || sub || item.codigo).trim();
  }

  // Se nada capturou especificamente, tenta usar o modeloAttr ou subgrupo limpo
  if (modeloAttr && sub.toUpperCase() === famUpper) {
    return modeloAttr.trim();
  }

  return sub || item.codigo;
}

function analisarVestuario(it) {
  let attrs = it.atributos || {};
  if (typeof attrs === 'string') {
    try { attrs = JSON.parse(attrs); } catch (e) { attrs = {}; }
  }

  let tam = attrs['Tamanho'] || attrs['TAMANHO'] || attrs['Size'] || '';

  if (!tam) {
    const desc = (it.subgrupo || it.descricao_longa || it.codigo || '').toUpperCase();
    const matchTam = desc.match(/\b(XXG|3XL|2XL|XG|XL|GG|G|M|P|S|L)\b/);
    if (matchTam) tam = matchTam[1];
    else tam = it.subgrupo || 'ÚNICO';
  }

  return { tamanho: tam };
}

function analisarAnzol(it) {
  let attrs = it.atributos || {};
  if (typeof attrs === 'string') {
    try { attrs = JSON.parse(attrs); } catch (e) { attrs = {}; }
  }

  let numero = '';
  const chavesNum = ['Tamanho', 'TAMANHO', 'Número', 'NÚMERO', 'Numero', 'Resistência (lb)', 'Resistencia', 'Libragem', 'Bitola', 'Modelo', 'MODELO'];
  for (let k of chavesNum) { 
    if (attrs[k]) { 
      numero = String(attrs[k]).trim(); 
      break; 
    } 
  }
  
  if (!numero || numero === 'S/N') {
    const subUpper = (it.subgrupo || '').toUpperCase();
    const matchCabo = subUpper.match(/(\d+\s*LBS?|\d+\s*KG|\d+\s*M(?:ETROS)?)/i);
    if (matchCabo) { 
      numero = matchCabo[1]; 
    } else {
      const match = subUpper.match(/(?:Nº?|Nº|NUMERO|TAMANHO|SABIKI)?\s*(\d{1,2}(?:\/\d)?(?:\s*CM|\s*MM)?|\b[PMGG]{1,3}\b)(?:\s*C\/|\s|$)/i);
      if (match) numero = match[1]; 
      else numero = (it.subgrupo || '').replace(it.grupo || '', '').trim() || 'S/N';
    }
  }

  // Busca a Quantidade nas chaves exatas do JSON
  let qtd = attrs['Quantidade'] || attrs['QUANTIDADE'] || attrs['Qtd'] || attrs['QTD'] || attrs['Qtd. Embalagem'] || attrs['Qtd Embalagem'] || attrs['Embalagem'] || '';

  if (!qtd) {
    const desc = (it.descricao_longa || it.descricao || it.subgrupo || '').toUpperCase();
    const matchQtdText = desc.match(/(?:C\/|CX\s*C\/|EMB\s*C\/|\bQTD:?\s*)(\d+)/i);
    if (matchQtdText) qtd = matchQtdText[1];
  }

  let qtdFormatada = '';
  if (qtd) {
    const qStr = String(qtd).trim();
    qtdFormatada = qStr.toUpperCase().includes('C/') || qStr.toUpperCase().includes('UN') ? qStr : `C/ ${qStr}`;
  }

  return { numero, qtd: qtdFormatada };
}

function analisarMolinete(it) {
  const attrs = it.atributos || {};
  let modelo = attrs['Modelo'] || attrs['MODELO'] || '';
  if (!modelo) { const partes = (it.subgrupo || '').trim().split(/\s+/); modelo = partes.slice(-2).join(' ') || it.subgrupo; }
  return { modelo };
}

function analisarCarretilha(it) {
  const attrs = it.atributos || {};
  let modelo = attrs['Modelo'] || attrs['MODELO'] || '';
  let ladoManivela = attrs['Lado Manivela'] || attrs['LADO MANIVELA'] || '';
  const relacao = attrs['Relação de recolhimento'] || '';
  if (!modelo) { const partes = (it.subgrupo || '').trim().split(/\s+/); modelo = partes.slice(-2).join(' ') || it.subgrupo; }
  if (!ladoManivela) {
    const subUpper = (it.subgrupo || '').toUpperCase();
    if (subUpper.includes('ESQ') || subUpper.includes('LEFT')) ladoManivela = 'ESQUERDA';
    else if (subUpper.includes('DIR') || subUpper.includes('RIGHT')) ladoManivela = 'DIREITA';
  }
  const partesVar = [];
  if (relacao) partesVar.push(relacao);
  return { modelo, ladoTag: ladoManivela, variacaoExtra: partesVar.join(' • ') };
}

function analisarMotor(it) {
  let attrs = it.atributos || {};
  if (typeof attrs === 'string') {
    try { attrs = JSON.parse(attrs); } catch (e) { attrs = {}; }
  }

  let detalhe = attrs['Potência'] || attrs['Libragem'] || attrs['LBS'] || attrs['Modelo'] || '';
  if (!detalhe) {
    const texto = (it.subgrupo || it.descricao_longa || '').toUpperCase();
    const match = texto.match(/\b(\d+\s*LBS?|\d+\s*LB|\d+\s*HP)\b/i);
    if (match) detalhe = match[1];
  }

  return { variacao: detalhe || it.subgrupo || 'Padrão' };
}

function analisarVara(it) {
  const attrs = it.atributos || {};
  const modeloJson = attrs['Modelo'] || attrs['MODELO'] || it.subgrupo || 'Vara';
  const ignorar = ['QTD', 'CX/CT', 'Modelo', 'MODELO']; 
  const especificacoes = {};
  for (const [chave, valor] of Object.entries(attrs)) {
    if (!ignorar.includes(chave) && valor) especificacoes[chave] = valor;
  }
  return { modeloJson, especificacoes };
}

function analisarLinha(it) {
  const attrs = it.atributos || {};
  let bitola = '-';
  const chaveBitola = Object.keys(attrs).find(k => k.toUpperCase() === 'MM' || k.toUpperCase() === 'BITOLA');
  if (chaveBitola) bitola = attrs[chaveBitola];

  let resistencia = '';
  const chaveLbs = Object.keys(attrs).find(k => k.toUpperCase().includes('LBS') || k.toUpperCase().includes('KG') || k.toUpperCase().includes('LIBRAS'));
  if (chaveLbs) resistencia = attrs[chaveLbs];

  return { bitola, resistencia };
}

function analisarIsca(it) {
  const attrs = it.atributos || {};
  const getVal = (arr) => { for (let k of arr) if (attrs[k]) return String(attrs[k]); return ''; };
  const modelo = getVal(['Modelo', 'MODELO']);
  const cor = getVal(['Cores', 'COR', 'Cor']);
  const tamanho = getVal(['Tamanho (cm)', 'TAMANHO']);
  const peso = getVal(['Peso (g)', 'PESO']);
  let especificacoes = [];
  if (tamanho) especificacoes.push(tamanho);
  if (peso) especificacoes.push(peso);
  return { modelo, cor, especificacoes: especificacoes.join(' • ') };
}

async function fazerLogin() {
  const cnpjInput = document.getElementById('inputCnpj');
  const cnpj = cnpjInput.value.replace(/\D/g, '');
  const erro = document.getElementById('loginErro');
  
  if (cnpj.length < 11) { erro.textContent = 'Digite um CNPJ válido.'; erro.style.display = 'block'; return; }

  try {
    const r = await fetch('/api/login/' + cnpj);
    const j = await r.json();
    if (!j.ok) { erro.textContent = j.erro || 'Erro ao validar CNPJ.'; erro.style.display = 'block'; return; }

    clienteLogado = j.cliente;
    porcentagemAcrescimo = j.regra_acrescimo.porcentagem;

    localStorage.setItem('clienteLogadoB2B', JSON.stringify(j.cliente));
    localStorage.setItem('acrescimoB2B', j.regra_acrescimo.porcentagem);
    configurarWhatsAppVendedor();

    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('infoCliente').style.display = 'flex';
    document.getElementById('nomeCliente').textContent = (clienteLogado.nome || '').split(' ')[0];
    document.getElementById('badgeUf').textContent = clienteLogado.uf;

    carregar();
  } catch (e) { erro.textContent = 'Erro de conexão.'; erro.style.display = 'block'; }
}

// FINALIZAR E ENVIAR PEDIDO (ESVAZIA O CARRINHO)
async function finalizarPedido() {
  const itens = Object.keys(carrinho).map(cod => {
    const item = carrinho[cod];
    const calc = calcularValoresProduto(item.precoBase, cod);
    return { codigo: cod, desc: item.desc, qtd: item.qtd, precoBase: item.precoBase, precoFinal: calc.precoFinal };
  });

  if (itens.length === 0) { alert('Seu carrinho está vazio.'); return; }

  // VERIFICA SE EXISTE RASCUNHO EM ABERTO ANTES DE ENVIAR (SE NÃO ESTIVER EDITANDO O PRÓPRIO RASCUNHO)
  if (!pedidoEmEdicaoId) {
    try {
      const r = await fetch(`/api/cliente/${encodeURIComponent(clienteLogado.cnpj)}/pedidos`);
      const j = await r.json();
      const rascunhoExistente = j.pedidos?.find(p => (p.status || '').toUpperCase() === 'RASCUNHO');

      if (rascunhoExistente) {
        alert(`⚠️ Você já possui o Rascunho #${rascunhoExistente.id} em aberto! Clique no botão "📋 Pedidos" no topo para editá-lo ou excluí-lo antes de enviar um novo.`);
        return;
      }
    } catch (e) {
      console.error("Erro ao validar rascunhos em aberto", e);
    }
  }

  const total = itens.reduce((acc, it) => acc + (it.precoFinal * it.qtd), 0);
  if (!confirm(`Deseja finalizar e enviar este pedido no valor de R$ ${fmtMoeda(total)}?`)) return;

  try {
    const r = await fetch('/api/pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: pedidoEmEdicaoId,
        cnpj_cliente: clienteLogado.cnpj,
        codigo_representante: clienteLogado.representante,
        status: 'ENVIADO',
        total,
        itens
      })
    });
    const j = await r.json();

    if (j.ok) {
      alert('✅ Pedido enviado com sucesso!');
      carrinho = {};
      pedidoEmEdicaoId = null;
      localStorage.removeItem('carrinho_b2b');
      atualizarCarrinho();
      fecharCarrinho();
    } else {
      alert('❌ Erro ao enviar o pedido: ' + j.erro);
    }
  } catch (e) {
    alert('❌ Erro ao enviar o pedido.');
  }
}

async function carregar() {
  try {
    const ro = await fetch('/api/ofertas'); const jo = await ro.json();
    if (jo.ok && jo.ofertas) { jo.ofertas.forEach(o => mapaOfertas[o.codigo] = o.desconto_porcentagem); }

    const rf = await fetch('/api/familias'); const jf = await rf.json();
    if (jf.ok) todasFamilias = jf.familias;
    const r = await fetch('/api/catalogo'); const j = await r.json();
    if (!j.ok) throw new Error('Erro API');
    
    todosItens = j.itens.map(normalizarItem).filter(it => it.grupo.length > 0 && it.estoque > 0);
    montarChips(); 
    montarBarraMarcas();
    renderizar();
  } catch (e) { document.getElementById('conteudo').innerHTML = '<div class="loading">Erro ao carregar.</div>'; }
}

function montarChips() {
  const contagem = {};
  todosItens.forEach(it => { contagem[it.grupo] = (contagem[it.grupo] || 0) + 1; });
  const todosGrupos = Object.keys(contagem);

  // Ordem de prioridade padrão dos grupos para o topo
  const prioridadeGrupos = [
    'MOLINETE',
    'CARRETILHA',
    'VARA',
    'LINHA',
    'ANZOL',
    'ISCA',
    'ALICATES',
    'VESTUARIO',
    'ACESSORIOS',
    'GARATEIAS',
    'GIRADORES'
  ];

  // Ordena os grupos
  todosGrupos.sort((a, b) => {
    const gA = a.toUpperCase().trim();
    const gB = b.toUpperCase().trim();
    
    const idxA = prioridadeGrupos.findIndex(p => gA.includes(p));
    const idxB = prioridadeGrupos.findIndex(p => gB.includes(p));

    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
    if (idxA !== -1) return -1;
    if (idxB !== -1) return 1;
    
    return contagem[b] - contagem[a]; // Se nenhum estiver na lista, ordena por quantidade
  });

  document.getElementById('chips').innerHTML = `
    <button class="chip chip-oferta ativo" onclick="trocarGrupo('__OFERTAS__', this)" title="Ofertas">🔥</button>
    ${todosGrupos.map(g => {
      const iconeUrl = getIconeUrl(g);
      return `<button class="chip" onclick="trocarGrupo('${g}', this)" title="${g}"><img src="${iconeUrl}" class="chip-img" alt="${g}" onerror="this.onerror=null; this.src='${BUCKET_ICONIS}ACESSORIOS.jpg';"></button>`;
    }).join('')}
  `;
}

function trocarGrupo(grupo, btn) {
  grupoAtual = grupo;
  marcaAtual = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  btn.classList.add('ativo'); 
  montarBarraMarcas();
  renderizar();
}

function filtrar() {
  let lista = todosItens;
  
  if (grupoAtual !== '__TODOS__' && grupoAtual !== '__OFERTAS__') {
    const grupoSelUpper = grupoAtual.toUpperCase().trim();

    lista = lista.filter(it => {
      const grupoItemUpper = (it.grupo || '').toUpperCase().trim();

      // Reconhece VESTUARIO, VESTUÁRIO e VESTUARIO E ACESSORIOS
      if (grupoSelUpper.includes('VESTUAR')) {
        return grupoItemUpper.includes('VESTUAR');
      }
      
      // Reconhece CARRETILHAS 02, MOLINETES, LINHAS (com ou sem plural/número)
      if (grupoSelUpper.includes('CARRETILHA')) return grupoItemUpper.includes('CARRETILHA');
      if (grupoSelUpper.includes('MOLINETE')) return grupoItemUpper.includes('MOLINETE');
      if (grupoSelUpper.includes('LINHA')) return grupoItemUpper.includes('LINHA');
      if (grupoSelUpper.includes('ISCA')) return grupoItemUpper.includes('ISCA');

      return grupoItemUpper === grupoSelUpper;
    });
  }

  if (marcaAtual) {
    lista = lista.filter(it => (it.marca || '').toUpperCase().trim() === marcaAtual.toUpperCase().trim());
  }

  if (buscaAtual) {
    const q = buscaAtual.toLowerCase();
    lista = lista.filter(it => 
      it.codigo.includes(q) || 
      it.subgrupo.toLowerCase().includes(q) || 
      it.marca.toLowerCase().includes(q)
    );
  }

  return lista;
}

function renderizar() {
  const cont = document.getElementById('conteudo');

  if (grupoAtual === '__OFERTAS__') {
    cont.innerHTML = `<iframe src="ofertas.html" class="iframe-ofertas"></iframe>`;
    return;
  }

  const lista = filtrar();
  if (!lista.length) { 
    cont.innerHTML = '<div class="loading">Nenhum produto encontrado.</div>'; 
    return; 
  }
  
  const processados = new Set(); 
  let html = '';

// 1. NORMALIZAÇÃO DE SEGURANÇA E PARSE DO JSON DO BANCO
  let familiasOrdenadas = todasFamilias.map(f => {
    let rawItens = f.subgrupos || f.itens || [];
    
    // Trata JSON duplo para itens/subgrupos
    if (typeof rawItens === 'string') {
      try { rawItens = JSON.parse(rawItens); } catch (e) {}
    }
    if (typeof rawItens === 'string') {
      try { rawItens = JSON.parse(rawItens); } catch (e) {}
    }
    if (!Array.isArray(rawItens)) rawItens = [];

    const codigosLimpos = rawItens.map(c => String(c).trim());

    // 👈 DECLARAÇÃO DA VARIÁVEL rawSubs (Evita o erro "rawSubs is not defined")
    let rawSubs = f.subdivisoes || [];
    if (typeof rawSubs === 'string') {
      try { rawSubs = JSON.parse(rawSubs); } catch (e) {}
    }
    if (typeof rawSubs === 'string') {
      try { rawSubs = JSON.parse(rawSubs); } catch (e) {}
    }
    if (!Array.isArray(rawSubs)) rawSubs = [];

    return {
      ...f,
      itens: codigosLimpos,
      subdivisoes: rawSubs
    };
  });

  // 2. ORDENA AS FAMÍLIAS (Respeita o campo 'ordem')
  familiasOrdenadas.sort((a, b) => {
    const ordemA = a.ordem !== undefined && a.ordem !== null && a.ordem !== '' ? Number(a.ordem) : 9999;
    const ordemB = b.ordem !== undefined && b.ordem !== null && b.ordem !== '' ? Number(b.ordem) : 9999;

    if (ordemA !== ordemB) return ordemA - ordemB;
    return (a.nome || '').localeCompare(b.nome || '');
  });

  // 3. RENDERIZA AS FAMÍLIAS E SEUS PRODUTOS
  familiasOrdenadas.forEach(fam => {
    // Comparação precisa normalizando o código do produto
    const filhos = lista.filter(it => fam.itens.includes(String(it.codigo).trim()));

    if (filhos.length > 0) {
      if (fam.ordem_customizada && fam.ordem_customizada.length > 0) {
        filhos.forEach(f => {
          const pos = fam.ordem_customizada.indexOf(f.subgrupo);
          if (pos !== -1) f.ordem_customizada_pos = pos;
        });
      }

      let tipo = 'comum';
      const primeiroItem = filhos[0];
      const attrs = Object.keys(primeiroItem.atributos || {}).map(k => k.toUpperCase());
      const grupoItem = (primeiroItem.grupo || '').toUpperCase();
      const nomeFam = (fam.nome || '').toUpperCase();

      if (nomeFam.includes('VARA')) tipo = 'vara';
      else if (nomeFam.includes('LINHA')) tipo = 'linha';
      else if (nomeFam.includes('ISCA') || attrs.includes('CORES') || attrs.includes('COR')) tipo = 'isca';
      else if (
        nomeFam.includes('ANZOL') || 
        nomeFam.includes('GARAT') || grupoItem.includes('GARAT') || 
        nomeFam.includes('SABIKI') || grupoItem.includes('SABIKI') || 
        nomeFam.includes('EMPATE') || nomeFam.includes('GIRADOR') || 
        nomeFam.includes('SNAP') || nomeFam.includes('CABO') || nomeFam.includes('LUVA')
      ) tipo = 'anzol';
      else if (nomeFam.includes('MOLINETE')) tipo = 'molinete';
      else if (nomeFam.includes('CARRETILHA')) tipo = 'equipamento_direto';
      else if (nomeFam.includes('MOTOR') || grupoItem.includes('MOTOR')) tipo = 'motor';
      else if (
        grupoItem.includes('VESTUARIO') || nomeFam.includes('VESTUARIO') ||
        grupoItem.includes('ACESSORIO') || nomeFam.includes('ACESSORIO') ||
        nomeFam.includes('ALICATE') || nomeFam.includes('TESOURA') || nomeFam.includes('BOLSA') || 
        nomeFam.includes('POCHETE') || nomeFam.includes('MOCHILA') || nomeFam.includes('OXIGENADOR') || 
        nomeFam.includes('FACA') || nomeFam.includes('CORDAO') || nomeFam.includes('CORDÃO') || 
        nomeFam.includes('CARRETEL') || nomeFam.includes('CAIXA') || nomeFam.includes('CADEIRA') ||
        nomeFam.includes('PONTEIRA') || nomeFam.includes('SUPORTE') || nomeFam.includes('ENROLADOR')
      ) tipo = 'grade';

      if (tipo === 'isca') html += renderFamiliaIsca(fam, filhos);
      else if (tipo === 'molinete') html += renderFamiliaMolinete(fam, filhos);
      else if (tipo === 'equipamento_direto') html += renderFamiliaEquipamentoDireto(fam, filhos);
      else if (tipo === 'anzol') html += renderFamiliaAnzol(fam, filhos);
      else if (tipo === 'motor') html += renderFamiliaMotor(fam, filhos);
      else if (tipo === 'vara') html += renderFamiliaVara(fam, filhos);
      else if (tipo === 'linha') html += renderFamiliaLinha(fam, filhos);
      else if (tipo === 'grade') html += renderFamiliaGrade(fam, filhos);
      else html += renderFamiliaComum(fam, filhos);
      
      filhos.forEach(it => processados.add(it.codigo));
    }
  });

  const soltos = lista.filter(it => !processados.has(it.codigo));
  if (soltos.length > 0) {
    html += `<div class="familia-bloco"><div class="familia-head"><h2>Outros Produtos</h2></div><div class="grade-soltos">${soltos.map(cardSoltos).join('')}</div></div>`;
  }
  cont.innerHTML = html;
}

    const calc = it.calculoPreco;

    return `

        <span class="molinete-badge">${q}</span>
        <div style="font-size:0.6rem; color:var(--cinza-400); font-weight:700;">CÓD: ${escapeHtml(it.codigo)}</div>
        <div class="molinete-numero">${escapeHtml(info.modelo || it.subgrupo)}</div>
        
        ${calc.temOferta ? `
          <div class="preco-box-oferta">
            <span class="preco-de">R$ ${fmtMoeda(calc.precoOriginal)}</span>
            <span class="preco-por">R$ ${fmtMoeda(calc.precoFinal)}</span>

function selecionarAcessorio(famId, codigo, url, descricao, nome) {
  const cardFam = document.getElementById(`card-fam-${famId}`);
  if (cardFam) {
    cardFam.querySelectorAll('.card-solto').forEach(c => c.style.borderColor = 'var(--cinza-200)');
    const cardAtivo = document.getElementById(`mini-${codigo}`);
    if (cardAtivo) cardAtivo.style.borderColor = 'var(--azul-800)';
    const fotoPai = document.getElementById(`foto-pai-${famId}`);
    const badgeNovidade = fotoPai.querySelector('.tarja-lancamento-foto');
    fotoPai.innerHTML = `${badgeNovidade ? badgeNovidade.outerHTML : ''}<img src="${url}">`;
    const btnDetalhes = document.getElementById(`btn-detalhes-${famId}`);
    if (btnDetalhes) { btnDetalhes.setAttribute('data-titulo', nome); btnDetalhes.setAttribute('data-desc', descricao); }
  }
}

function trocarModeloIsca(famId, modeloNome) {
  const modelos = window.iscasData[famId]; 
  const modelo = modelos.find(m => m.nome === modeloNome);
  const card = document.getElementById(`card-fam-${famId}`);
  
  card.querySelectorAll('.isca-modelo-btn').forEach(b => {
    if(b.textContent.trim() === modeloNome) b.classList.add('ativo'); else b.classList.remove('ativo');

  const grade = document.getElementById(`grade-cores-${famId}`);
  grade.innerHTML = modelo.itens.map(it => {
    const info = analisarIsca(it); 
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    const calc = it.calculoPreco;
    return `

function selecionarIsca(famId, codigo, url) {

  const data = window.anzolData[famId]; 
  const sub = data.subdivisoes[subIndex];
  const card = document.getElementById(`card-fam-${famId}`);
  card.querySelectorAll('.anzol-tab').forEach(b => b.classList.remove('ativo'));
  card.querySelectorAll('.anzol-tab')[subIndex].classList.add('ativo');
  
  const itensFiltrados = data.itens.filter(it => sub.itens.includes(it.codigo) && it.estoque > 0);
  itensFiltrados.sort((a, b) => a.ordem_excel - b.ordem_excel);

  document.getElementById(`grade-numeros-${famId}`).innerHTML = itensFiltrados.map(it => {
    const info = analisarAnzol(it); 
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    const calc = it.calculoPreco;

    return `
      <div class="anzol-numero-card ${q>0?'tem-qtd':''}" id="mini-${it.codigo}">
        <span class="anzol-badge">${q}</span>
        <div class="anzol-numero">${escapeHtml(info.numero)}</div>
        ${info.qtd ? `<div style="font-size:.6rem; color:var(--cinza-500); font-weight:700; margin-bottom:2px; text-align:center;">${escapeHtml(info.qtd)}</div>` : ''}
        
        ${calc.temOferta ? `
          <div class="preco-box-oferta">
            <span class="preco-de">R$ ${fmtMoeda(calc.precoOriginal)}</span>
            <span class="preco-por">R$ ${fmtMoeda(calc.precoFinal)}</span>
          </div>
        ` : `<div class="anzol-preco">R$ ${fmtMoeda(calc.precoFinal)}</div>`}

        <div class="anzol-qtd-ctrl" onclick="event.stopPropagation()">
          <button onclick="mudarQtd('${it.codigo}', -1)">−</button>
          <input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)">
          <button onclick="mudarQtd('${it.codigo}', 1)">+</button>
        </div>
      </div>`;
  }).join('');
}

function renderFamiliaComum(fam, itens) {
  const primeiroItem = itens[0];
  const imgInicial = primeiroItem?.imagem_url || '';
  const itensComEstoque = itens.filter(it => it.estoque > 0);
  if (itensComEstoque.length === 0) return '';

  itensComEstoque.sort((a, b) => a.ordem_excel - b.ordem_excel);
  
  const linhasHtml = itensComEstoque.map(it => {
    const q = carrinho[it.codigo] ? carrinho[it.codigo].qtd : 0;
    const calc = it.calculoPreco;

    // 📌 BADGE DE LOTE DE 10 UNIDADES
    const badgeLote = PRODUTOS_LOTE_10.includes(String(it.codigo))
      ? `<span style="background:#f59e0b; color:white; font-size:0.65rem; font-weight:800; padding:2px 6px; border-radius:4px; margin-left:6px; white-space:nowrap;">📦 Mín. 10 un.</span>`
      : '';

    return `
      <div class="linha-filho">
        <div class="l-cod">${it.codigo}</div>
        <div class="l-nome">
          ${escapeHtml(it.subgrupo)}
          ${badgeLote}
          ${calc.temOferta ? `<span class="tarja-oferta-item">🔥 -${calc.pctDesconto}%</span>` : ''}
        </div>
        <div class="l-var-col"></div>
        ${calc.temOferta ? `
          <div class="preco-box-oferta">
            <span class="preco-de">R$ ${fmtMoeda(calc.precoOriginal)}</span>
            <span class="preco-por">R$ ${fmtMoeda(calc.precoFinal)}</span>
          </div>
        ` : `<div class="l-preco">R$ ${fmtMoeda(calc.precoFinal)}</div>`}
        <div class="l-qtd" onclick="event.stopPropagation()">
          <div class="qtd-ctrl"><button onclick="mudarQtd('${it.codigo}', -1)">−</button><input type="number" min="0" value="${q}" onchange="setQtd('${it.codigo}', this.value)"><button onclick="mudarQtd('${it.codigo}', 1)">+</button></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="familia-bloco">
      <div class="familia-head"><h2>${escapeHtml(fam.nome)}</h2> <span class="marca-badge">${escapeHtml(itens[0].marca)}</span></div>
      <div class="familia-card" id="card-fam-${fam.id}">
        <div class="familia-side"><div class="familia-foto-principal" onclick="abrirZoomImagem(this)">${imgInicial ? `<img src="${imgInicial}">` : '🖼️'}</div></div>
        <div class="familia-info">
          <button class="btn-detalhes" data-titulo="${escapeHtml(fam.nome)}" data-desc="${escapeHtml(primeiroItem.descricao_longa)}" onclick="abrirModalPorBotao(this)">🔍 Ver detalhes</button>
          <div class="lista-filhos">${linhasHtml}</div>
        </div>
      </div>
    </div>`;
}

function cardSoltos(it) {
  const calc = it.calculoPreco;
  return `
    <div class="card-solto" style="position:relative;">
      ${it.is_lancamento ? `<span class="tarja-lancamento-foto">✨ NOVIDADE</span>` : ''}
      ${calc.temOferta ? `<div style="position:absolute; top:4px; right:4px; background:#ef4444; color:white; font-size:8px; font-weight:800; padding:2px 4px; border-radius:4px;">-${calc.pctDesconto}%</div>` : ''}
      <div class="img" onclick="abrirZoomImagem(this)">${it.imagem_url ? `<img src="${it.imagem_url}">` : '🖼️'}</div>
      
      <div style="font-size:0.6rem; color:var(--cinza-400); font-weight:700; margin-bottom:2px;">
        CÓD: ${escapeHtml(it.codigo)}
      </div>

      <div class="nome">${escapeHtml(it.subgrupo)}</div>
      ${calc.temOferta ? `
        <div class="preco-box-oferta" style="align-items:center;">
          <span class="preco-de">R$ ${fmtMoeda(calc.precoOriginal)}</span>
          <span class="preco-por">R$ ${fmtMoeda(calc.precoFinal)}</span>
        </div>
      ` : `<div class="preco">R$ ${fmtMoeda(calc.precoFinal)}</div>`}
    </div>`;
}

function abrirModalDescricao(titulo, texto) {
  if (!texto) texto = 'Este produto não possui descrição detalhada.';
  document.getElementById('modalTitulo').textContent = titulo || 'Detalhes do Produto';
  document.getElementById('modalBody').innerHTML = `<p style="font-size:0.85rem; line-height:1.4;">${escapeHtml(texto)}</p>`;
  document.getElementById('modalBg').classList.add('on');
}
function abrirModalPorBotao(btn) { abrirModalDescricao(btn.getAttribute('data-titulo'), btn.getAttribute('data-desc')); }
function fecharModal(ev, force) {
  if (!force && ev && ev.target && ev.target.id !== 'modalBg') return;
  document.getElementById('modalBg').classList.remove('on');
}

function buscarItem(codigo) { return todosItens.find(i => i.codigo === codigo); }
function mudarQtd(cod, delta) { 
  const a = carrinho[cod] ? carrinho[cod].qtd : 0;
  
  // Se for um produto de lote 10, o botão + ou - avança de 10 em 10
  if (PRODUTOS_LOTE_10.includes(String(cod))) {
    const passo = delta > 0 ? 10 : -10;
    setQtd(cod, a + passo);
  } else {
    setQtd(cod, a + delta);
  }
}
function setQtd(cod, valor) {
  let q = parseInt(valor) || 0; 
  const item = buscarItem(cod);

  // REGRA DO LOTE DE 10 UNIDADES
  if (q > 0 && PRODUTOS_LOTE_10.includes(String(cod))) {
    // Arredonda para o múltiplo de 10 mais próximo para cima (ex: 1->10, 12->20)
    const resto = q % 10;
    if (resto !== 0) {
      q = Math.ceil(q / 10) * 10;
    }
  }

  if (q <= 0) {
    delete carrinho[cod];
  } else {
    carrinho[cod] = { 
      qtd: q, 
      precoBase: item.precoBase, 
      desc: item.subgrupo, 
      img: item.imagem_url 
    };
  }

  // Atualiza os inputs na tela
  document.querySelectorAll(`input[onchange*="'${cod}'"]`).forEach(inp => inp.value = q);

  // Destaque visual do card
  const card = document.getElementById(`mini-${cod}`);
  if (card) {
    const badge = card.querySelector('.anzol-badge') || card.querySelector('.isca-badge');
    if (q > 0) { 
      card.classList.add('tem-qtd'); 
      if (badge) badge.textContent = q; 
    } else {
      card.classList.remove('tem-qtd');
    }
  }

  atualizarCarrinho();
}

function atualizarCarrinho() {
  const itens = Object.keys(carrinho); 
  let total = 0, qtdTotal = 0;
  
  const html = itens.map(cod => {
    const i = carrinho[cod];
    const calc = calcularValoresProduto(i.precoBase, cod);
    const sub = calc.precoFinal * i.qtd; 
    total += sub; qtdTotal += i.qtd;
    
    return `
      <div class="item-carrinho">
        ${i.img ? `<img src="${i.img}">` : '<div style="width:30px;text-align:center;font-size:16px;">🖼️</div>'}
        <div class="dados">
          <span class="titulo" style="font-weight:bold; color:var(--azul-800);">${escapeHtml(i.desc)}</span>
          <span class="preco" style="display:block; color:var(--verde); font-weight:bold;">${i.qtd}x R$ ${fmtMoeda(sub)}</span>
        </div>
        <div class="acoes"><button onclick="setQtd('${cod}', 0)" style="background:none; border:none; color:var(--vermelho); font-weight:bold; cursor:pointer;">✕</button></div>
      </div>`;
  }).join('');

  const btnFab = document.getElementById('btnCarrinho');
  const badgeFab = document.getElementById('topoQtd');
  
  if (qtdTotal > 0) { btnFab.style.display = 'flex'; badgeFab.textContent = qtdTotal; } 
  else { btnFab.style.display = 'none'; fecharCarrinho(); }

  document.getElementById('carrinhoTotal').textContent = `R$ ${fmtMoeda(total)}`;
  document.getElementById('listaCarrinho').innerHTML = html || '<div style="text-align:center;color:#94a3b8;padding:20px;">Vazio</div>';
}

function toggleCarrinho() { document.getElementById('painelCarrinho').classList.toggle('on'); }
function fecharCarrinho() { document.getElementById('painelCarrinho').classList.remove('on'); }

let deb;
document.getElementById('busca').addEventListener('input', e => {
  clearTimeout(deb); deb = setTimeout(() => { buscaAtual = e.target.value; renderizar(); }, 150);
});

document.getElementById('inputCnpj').addEventListener('input', function(e) {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length > 14) v = v.slice(0, 14);
  v = v.replace(/^(\d{2})(\d)/, '$1.$2');
  v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
  v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
  v = v.replace(/(\d{4})(\d)/, '$1-$2');
  e.target.value = v;
});

document.getElementById('inputCnpj').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fazerLogin();
});

window.addEventListener('message', function(event) {
  if (event.data && event.data.tipo === 'ATUALIZAR_CARRINHO') {
    carrinho = JSON.parse(localStorage.getItem('carrinho_b2b') || '{}');
    atualizarCarrinho();
  }
});
</script>
