<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novidades Marine Sports</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f3f6fa;color:#12304b}header{background:#002b50;color:white;padding:18px max(20px,calc((100% - 1200px)/2));display:flex;gap:20px;justify-content:space-between;align-items:center}header img{width:160px;background:white;border-radius:8px;padding:8px}a{color:inherit}main{max-width:1200px;margin:auto;padding:24px 20px 100px}.hero{background:linear-gradient(120deg,#003366,#006a91);color:white;border-radius:20px;padding:36px;margin-bottom:24px}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:8px 0}.hero p{line-height:1.6;max-width:650px}.eyebrow{color:#7ce8dd;text-transform:uppercase;font-weight:800;letter-spacing:2px}.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;font-weight:700;background:#003366;color:white}button.ativo{background:#007d72}input{border:1px solid #c9d5e1;border-radius:9px;padding:11px;min-width:0}.filtros input{flex:1;min-width:200px}.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:22px}.produto{background:white;border:1px solid #e0e7ef;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 20px #00336608}.foto{height:230px;position:relative;display:flex;align-items:center;justify-content:center;padding:20px}.foto img{width:100%;height:100%;object-fit:contain}.tarjas{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}.tarja{font-size:.68rem;font-weight:900;background:#003366;color:white;border-radius:5px;padding:6px 9px}.tarja.chegou{background:#008476}.dados{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}.dados h2{font-size:1rem;margin:0;line-height:1.5}.codigo,.spec{font-size:.78rem;color:#61778b}.preco{font-size:1.3rem;font-weight:850;color:#00695f;margin-top:auto}.qtd{display:flex;align-items:center;gap:10px}.qtd input{width:85px}.barra{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d7e1ec;padding:14px 20px;display:flex;gap:18px;align-items:center;justify-content:center;box-shadow:0 -4px 24px #00336612}.barra button{background:#008476}button:disabled{opacity:.5;cursor:wait}.vazio{padding:40px;text-align:center;grid-column:1/-1}.conta{font-size:.85rem}dialog{border:0;border-radius:16px;padding:24px;max-width:400px;width:calc(100% - 32px)}dialog::backdrop{background:#001f3fcc}dialog input{width:100%;margin-bottom:14px}#erroLogin{color:#b91c1c;font-size:.85rem}.topo-login{background:transparent;border:1px solid #ffffff66}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}@media(max-width:520px){header{flex-wrap:wrap}.hero{padding:24px}.barra{justify-content:space-between;font-size:.85rem}.barra button{font-size:.85rem}}
.tarja{background:#dc2626}.tarja.chegou{background:#2563eb}
.produto.novidade{border-top:4px solid #dc2626}.produto.chegou{border-top:4px solid #2563eb}.produto.novidade.chegou{border-top:4px solid #dc2626;border-bottom:4px solid #2563eb}
.filtros [data-filtro="lancamento"]{background:#dc2626}.filtros [data-filtro="chegou"]{background:#2563eb}.filtros button.ativo{outline:3px solid #94a3b8;outline-offset:2px}
header{padding:10px max(20px,calc((100% - 1160px)/2));gap:16px}
header img{width:110px;height:42px;object-fit:contain;padding:5px;border-radius:5px}
header a{margin-left:auto;font-size:.85rem}header button{padding:8px 12px;font-size:.8rem}
header .voltar-pedidos{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#003366;text-decoration:none;font-weight:800;padding:10px 16px;border-radius:8px;border:2px solid #7dd3fc;text-align:center;line-height:1.3}
header .voltar-pedidos:hover{background:#e0f2fe}
main{padding-top:18px}
.hero{background:none;color:#12304b;border-radius:0;padding:0;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
.hero h1{font-size:1.5rem;margin:0;line-height:1.3}
.hero .conta{color:#61778b;font-size:.8rem;line-height:1.5}
.filtros{margin-bottom:14px}.filtros button,.filtros input{padding:9px 12px;font-size:.85rem}
#statusNovidades{font-size:.8rem;color:#61778b;margin:0 0 14px}
@media(max-width:520px){header{flex-wrap:nowrap;gap:10px;padding:8px 14px}header img{width:88px;height:36px}header a{font-size:.75rem}header button{font-size:.75rem;padding:8px}main{padding:14px 14px 100px}.hero{padding:0;margin-bottom:14px;gap:6px}.hero h1{font-size:1.25rem}.hero .conta{width:100%}.filtros input{flex-basis:100%}}
</style>
</head>
<body>
<header><img src="https://gpzqzwrqndawhhglycat.supabase.co/storage/v1/object/public/PECAS/logo--marine-rgb-png.png" alt="Marine Sports"><a class="voltar-pedidos" href="index.html">← Voltar à página de pedidos</a><button class="topo-login" id="botaoConta" type="button">Entrar com CNPJ</button></header>
<main><section class="hero"><h1>Novidades</h1><span class="conta" id="contaAtual"></span></section>
<nav class="filtros" aria-label="Filtrar novidades"><button type="button" data-filtro="todos" class="ativo">Todos</button><button type="button" data-filtro="lancamento">Lançamentos</button><button type="button" data-filtro="chegou">Chegou</button><input type="search" id="buscaNovidades" placeholder="Buscar por código, produto ou marca" aria-label="Buscar novidades"></nav>
<p id="statusNovidades" role="status">Carregando novidades...</p><div class="grade" id="gradeNovidades"></div></main>
<div class="barra"><span id="resumoSelecao">Selecione os produtos</span><button type="button" id="adicionarCarrinho">Adicionar e abrir carrinho →</button></div>
<dialog id="loginNovidades"><h2>Acesse com seu CNPJ</h2><p>Consulte seus preços e continue no mesmo carrinho do catálogo.</p><form id="formLoginNovidades"><input id="cnpjNovidades" inputmode="numeric" autocomplete="off" placeholder="CNPJ" required aria-label="CNPJ"><p id="erroLogin" role="status"></p><button type="submit">Entrar</button> <button type="button" id="fecharLogin">Fechar</button></form></dialog>
<script src="novidades.js"></script>
</body></html>
